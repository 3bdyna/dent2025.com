<style>
    /* =========================================================
       DESIGN/CSS LAYER
       Separated from logic to allow easy swapping of designs
       ========================================================= */
    :root {
        --bg-color: #0f1013;
        --card-bg: rgba(255, 255, 255, 0.035);
        --card-hover-bg: rgba(255, 255, 255, 0.065);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        
        /* Event Type Accent Colors */
        --color-start: #10b981;    /* Emerald Green */
        --color-payment: #f59e0b;  /* Warm Gold */
        --color-holiday: #0284c7;  /* Sky Blue */
        --color-exam: #f43f5e;     /* Coral / Rose Red */
        --color-other: #64748b;    /* Slate Gray */
    }

    .dent-schedule-container {
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding: 24px;
        border-radius: 18px;
        direction: rtl;
        max-width: 720px;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .dent-schedule-title {
        text-align: center;
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 18px;
        color: #ffffff;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 14px;
    }

    /* Stats Bar */
    .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
        margin-bottom: 22px;
    }
    
    .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 10px 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.2);
    }
    .stat-title {
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 2px;
        color: #cbd5e1;
    }
    .stat-subtitle {
        font-size: 0.58rem;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
    }
    .stat-value {
        font-size: 1.05rem;
        font-weight: 700;
        color: #ffffff;
    }
    .stat-subvalue {
        font-size: 0.68rem;
        color: #94a3b8;
        margin-top: 2px;
    }
    #stat-exam .stat-value { color: var(--color-exam); }

    /* Timeline Section */
    .timeline-month {
        margin-bottom: 25px;
    }

    .month-header {
        font-size: 1.08rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .month-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
    }

    .timeline-events {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        padding-right: 22px;
        border-right: 2px solid rgba(255, 255, 255, 0.12);
    }

    /* Event Card (Refined High-Contrast Architecture) */
    .event-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-right: 4px solid var(--event-color);
        padding: 14px 18px;
        border-radius: 12px;
        position: relative;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .event-card:hover {
        transform: translateX(-3px);
        background: var(--card-hover-bg);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.16);
    }

    /* Dot on timeline line */
    .event-card::before {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: var(--event-color);
        right: -28px;
        top: 20px;
        box-shadow: 0 0 10px var(--event-color);
    }

    .event-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        gap: 10px;
        flex-wrap: wrap;
    }

    .event-dates-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .event-gregorian-date {
        font-size: 0.88rem;
        font-weight: 600;
        color: #e2e8f0;
    }

    .event-hijri-date {
        font-size: 0.78rem;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.05);
        padding: 2px 7px;
        border-radius: 4px;
        direction: rtl;
    }

    .event-badges-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .event-type-badge {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--event-color);
        border: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
    }

    .event-countdown-pill {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 5px;
        white-space: nowrap;
    }
    .event-countdown-pill.future {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .event-countdown-pill.today {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .event-countdown-pill.passed {
        background: rgba(255, 255, 255, 0.03);
        color: #64748b;
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .event-delete-btn {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #ef4444;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        padding: 0;
        line-height: 1;
        transition: all 0.2s ease;
        margin-right: 4px;
    }
    .event-delete-btn:hover {
        background: rgba(239, 68, 68, 0.35);
        transform: scale(1.1);
    }

    .event-title {
        font-size: 1.08rem;
        font-weight: 700;
        margin: 0;
        color: #ffffff !important;
        line-height: 1.5;
        letter-spacing: -0.01em;
        text-align: right;
        word-break: break-word;
    }

    /* Empty state */
    .schedule-loading, .schedule-error {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .dent-schedule-container {
            padding: 14px 12px;
            border-radius: 12px;
        }
        .event-card {
            padding: 12px 14px;
        }
        .event-title {
            font-size: 0.98rem;
        }
        .event-card-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        .event-dates-wrap, .event-badges-wrap {
            width: 100%;
            justify-content: space-between;
        }
    }
</style>

<!-- HTML STRUCTURE -->
<div class="dent-schedule-container" id="dent-schedule-app">
    <h2 class="dent-schedule-title">التقويم الدراسي</h2>
    
    <div class="stats-bar" id="schedule-stats" style="display: none;">
        <div class="stat-card" id="stat-exam">
            <span class="stat-title">أقرب اختبار</span>
            <span class="stat-subtitle">CLOSEST EXAM</span>
            <span class="stat-value" id="val-exam">لا يوجد / None</span>
            <span class="stat-subvalue">حتى الآن</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">الأيام المتبقية للترم</span>
            <span class="stat-subtitle">DAYS LEFT</span>
            <span class="stat-value" id="val-days">0</span>
            <span class="stat-subvalue">in semester / في الترم</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">الإجازة القادمة</span>
            <span class="stat-subtitle">NEXT VACATION</span>
            <span class="stat-value" id="val-vacation">انتهت / Passed</span>
            <span class="stat-subvalue" id="val-vacation-name"></span>
        </div>
    </div>

    <div id="schedule-content">
        <div class="schedule-loading">جاري تحميل التقويم...</div>
    </div>
</div>
