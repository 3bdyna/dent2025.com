<style>
    /* =========================================================
       DENT2025 ACADEMIC TIMELINE
       Strictly adhering to AGENTS.md Section 11 Design System:
       - Curated, muted dark-mode palette (#121212 canvas, #1e1e1e card, #27272a zinc border)
       - High-contrast readable slate/white typography (#f8fafc / #e2e8f0 / #94a3b8)
       - Restrained, soft accents (#60a5fa soft blue, subtle active indicators)
       - NO loud popping saturated colors or neon glows
       - NO decorative emojis
       - RTL first, Outfit & Noto Kufi Arabic typography
       ========================================================= */
    :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --card-hover-bg: #26262a;
        --border-color: #27272a;
        --border-hover: #3f3f46;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-soft: #60a5fa;
        --accent-active: rgba(34, 197, 94, 0.5);
    }

    .dent-schedule-container {
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding: 24px;
        border-radius: 16px;
        direction: rtl;
        max-width: 720px;
        margin: 0 auto;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .dent-schedule-title {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 18px;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 14px;
        letter-spacing: -0.01em;
    }

    /* Stats Bar (Muted Dark-Mode Architecture) */
    .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
        margin-bottom: 22px;
    }
    
    .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
    }
    .stat-title {
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 2px;
        color: #cbd5e1;
    }
    .stat-subtitle {
        font-size: 0.58rem;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
    }
    .stat-value {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-primary);
    }
    .stat-subvalue {
        font-size: 0.68rem;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    /* Timeline Section */
    .timeline-month {
        margin-bottom: 26px;
    }

    .month-header {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .month-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }

    .timeline-events {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        padding-right: 20px;
        border-right: 2px solid var(--border-color);
    }

    /* Event Card (Muted, High-Contrast Architecture) */
    .event-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 14px 18px;
        border-radius: 12px;
        position: relative;
        transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .event-card:hover {
        transform: translateX(-3px);
        background: var(--card-hover-bg);
        border-color: var(--border-hover);
    }

    /* Subtle, restrained dot on timeline line */
    .event-card::before {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #52525b;
        right: -25px;
        top: 20px;
        border: 2px solid var(--bg-color);
    }
    .event-card.is-today::before {
        background-color: var(--accent-soft);
    }

    .event-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        gap: 10px;
        flex-wrap: wrap;
    }

    .event-dates-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .event-gregorian-date {
        font-size: 0.86rem;
        font-weight: 600;
        color: #e2e8f0;
    }

    .event-hijri-date {
        font-size: 0.78rem;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.05);
        padding: 2px 7px;
        border-radius: 4px;
        direction: rtl;
    }

    .event-badges-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .event-type-badge {
        font-size: 0.72rem;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        border: 1px solid var(--border-color);
        white-space: nowrap;
    }

    .event-countdown-pill {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        white-space: nowrap;
    }
    .event-countdown-pill.future {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .event-countdown-pill.today {
        background: rgba(96, 165, 250, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(96, 165, 250, 0.3);
    }
    .event-countdown-pill.passed {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .event-delete-btn {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        padding: 0;
        line-height: 1;
        transition: all 0.2s ease;
        margin-right: 4px;
    }
    .event-delete-btn:hover {
        background: rgba(239, 68, 68, 0.25);
        color: #ffffff;
    }

    .event-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary) !important;
        line-height: 1.5;
        letter-spacing: -0.01em;
        text-align: right;
        word-break: break-word;
    }

    /* Empty state */
    .schedule-loading, .schedule-error {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .dent-schedule-container {
            padding: 14px 12px;
            border-radius: 12px;
        }
        .event-card {
            padding: 12px 14px;
        }
        .event-title {
            font-size: 0.98rem;
        }
        .event-card-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        .event-dates-wrap, .event-badges-wrap {
            width: 100%;
            justify-content: space-between;
        }
    }
</style>

<!-- HTML STRUCTURE -->
<div class="dent-schedule-container" id="dent-schedule-app">
    <h2 class="dent-schedule-title">التقويم الدراسي</h2>
    
    <div class="stats-bar" id="schedule-stats" style="display: none;">
        <div class="stat-card" id="stat-exam">
            <span class="stat-title">أقرب اختبار</span>
            <span class="stat-subtitle">CLOSEST EXAM</span>
            <span class="stat-value" id="val-exam">لا يوجد / None</span>
            <span class="stat-subvalue">حتى الآن</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">الأيام المتبقية للترم</span>
            <span class="stat-subtitle">DAYS LEFT</span>
            <span class="stat-value" id="val-days">0</span>
            <span class="stat-subvalue">in semester / في الترم</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">الإجازة القادمة</span>
            <span class="stat-subtitle">NEXT VACATION</span>
            <span class="stat-value" id="val-vacation">انتهت / Passed</span>
            <span class="stat-subvalue" id="val-vacation-name"></span>
        </div>
    </div>

    <div id="schedule-content">
        <div class="schedule-loading">جاري تحميل التقويم...</div>
    </div>
</div>
