<style>
    /* =========================================================
       DENT2025 ACADEMIC TIMELINE (ALIGNED WITH CLASS SCHEDULE)
       Matches the glassmorphic, translucent dark aesthetic:
       - Translucent canvas (rgba(255, 255, 255, 0.03))
       - Elevated cards (rgba(0, 0, 0, 0.25)) with subtle borders
       - Slate/white typography (#f8fafc / #94a3b8 / #64748b)
       - Clean, distraction-free RTL typography
       ========================================================= */
    :root {
        --bg-color: rgba(14, 14, 18, 0.78);
        --card-bg: rgba(0, 0, 0, 0.48);
        --card-hover-bg: rgba(255, 255, 255, 0.08);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.22);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
    }

    .dent-schedule-container {
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        background-color: var(--bg-color);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text-primary);
        padding: 24px;
        border-radius: 16px;
        direction: rtl;
        max-width: 760px;
        margin: 36px auto 30px auto;
        border: 1px solid var(--border-color);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }

    .dent-schedule-title {
        text-align: center;
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 30px;
        color: var(--text-primary);
        border-bottom: none;
        letter-spacing: -0.01em;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 36px;
    }
    
    .stat-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        background: var(--card-hover-bg);
    }
    .stat-title {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
        display: block;
    }
    .stat-value {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        display: block;
    }
    .stat-subvalue {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 4px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Timeline Container */
    .timeline {
        position: relative;
        padding-right: 140px;
    }
    .timeline::before {
        content: '';
        position: absolute;
        right: 120px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--border-color);
    }

    /* Month Header */
    .timeline-month {
        /* Wrapper for the month text and its events */
    }
    .month-header {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 32px 0 20px 0;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .timeline-month:first-child .month-header { margin-top: 0; }
    .month-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }
    
    .timeline-events {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Event Wrapper */
    .event {
        position: relative;
    }
    
    /* Date Area (Right side of timeline) */
    .event-date {
        position: absolute;
        right: -140px;
        top: 50%;
        transform: translateY(-50%);
        width: 105px;
        text-align: left;
    }
    .date-main { margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .day-name { font-size: 0.8rem; color: var(--text-secondary); display: block; }
    .gregorian { font-weight: 500; font-size: 0.95rem; color: var(--text-primary); font-family: 'Outfit'; display: block; line-height: 1.2; }
    .hijri { font-size: 0.75rem; color: var(--text-muted); display: block; line-height: 1.3; }
    
    /* Timeline Dot */
    .event-dot {
        position: absolute;
        right: -24px;
        top: 50%;
        transform: translateY(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        border: 2px solid rgba(20, 20, 25, 0.9);
        z-index: 2;
        transition: all 0.2s ease;
    }
    .event.highlight .event-dot { 
        background: var(--text-primary); 
        border-color: rgba(255, 255, 255, 0.4); 
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); 
    }
    .event.passed .event-dot { 
        background: transparent; 
        border-color: rgba(255, 255, 255, 0.15); 
    }
    
    /* Event Card (Left side of timeline) */
    .event-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 14px 16px;
        position: relative;
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }
    .event-card:hover {
        border-color: var(--border-hover);
        background-color: var(--card-hover-bg);
        transform: translateX(-3px);
    }
    .event.highlight .event-card { 
        border-color: rgba(255, 255, 255, 0.35); 
        background: rgba(255, 255, 255, 0.08); 
    }
    .event.passed .event-card { opacity: 0.55; }
    .event.passed .event-card:hover { opacity: 0.8; }
    
    /* Saudi National Day — subtle internal emerald gradient (zero outer glow) */
    .event-card.event-card-national-day {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(0, 0, 0, 0.3) 70%);
        border-color: rgba(16, 185, 129, 0.28);
        box-shadow: none;
    }
    .event-card.event-card-national-day:hover {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.14) 0%, rgba(255, 255, 255, 0.08) 70%);
        border-color: rgba(16, 185, 129, 0.45);
        box-shadow: none;
    }
    .event-card.event-card-national-day .badge {
        background: rgba(16, 185, 129, 0.12);
        border-color: rgba(16, 185, 129, 0.3);
        color: #6ee7b7;
    }
    .event.event-national-day .event-dot {
        background: #10b981;
        border-color: rgba(20, 20, 25, 0.9);
    }
    
    .event-info {
        flex: 1;
    }
    .event-title { 
        font-weight: 500; 
        font-size: 1.05rem; 
        line-height: 1.4; 
        color: var(--text-primary) !important; 
        margin: 0; 
        text-align: right;
    }
    
    .event-badges {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        min-width: 90px;
    }
    
    .badge {
        font-size: 0.72rem;
        padding: 3px 9px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        white-space: nowrap;
    }
    .badge.highlight-badge {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.35);
        font-weight: 600;
    }
    .badge.passed-badge {
        background: transparent;
        border-style: dashed;
        border-color: rgba(255, 255, 255, 0.08);
        color: #64748b;
    }
    
    /* Admin controls inside badges */
    .event-edit-btn,
    .event-delete-btn {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        transition: all 0.2s ease;
        margin-top: 4px;
    }
    .event-edit-btn {
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #60a5fa;
    }
    .event-edit-btn:hover {
        background: rgba(59, 130, 246, 0.25);
        color: #ffffff;
    }
    .event-delete-btn {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
    }
    .event-delete-btn:hover {
        background: rgba(239, 68, 68, 0.25);
        color: #ffffff;
    }
    .event-edit-btn svg,
    .event-delete-btn svg {
        width: 14px;
        height: 14px;
    }

    /* Empty state */
    .schedule-loading, .schedule-error {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .dent-schedule-container {
            padding: 16px 12px;
        }
        .stats-grid {
            grid-template-columns: repeat(1, 1fr);
            gap: 8px;
        }
        .timeline {
            padding-right: 90px;
        }
        .timeline::before {
            right: 70px;
        }
        .event-date {
            right: -90px;
            width: 60px;
        }
        .gregorian { font-size: 0.8rem; }
        .day-name, .hijri { font-size: 0.65rem; }
        .event-dot {
            right: -24px; /* relative to padding edge of timeline */
        }
        .event-card {
            padding: 12px;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .event-badges {
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
        }
    }
</style>

<!-- HTML STRUCTURE -->

    <div class="stats-grid" id="schedule-stats" style="display: none;">
