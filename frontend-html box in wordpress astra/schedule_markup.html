<style>
    /* =========================================================
       DENT2025 ACADEMIC TIMELINE (MONOCHROME VERTICAL)
       Strictly adhering to AGENTS.md Section 11 Design System:
       - Curated, muted dark-mode palette (#121212 canvas, #18181b card, #27272a border)
       - High-contrast readable slate/white typography (#f8fafc / #a1a1aa / #71717a)
       - NO loud popping saturated colors or neon glows
       - NO decorative emojis
       - RTL first, Outfit & Noto Kufi Arabic typography
       ========================================================= */
    :root {
        --bg-color: #121212;
        --card-bg: #18181b;
        --card-hover-bg: #27272a;
        --border-color: #27272a;
        --border-hover: #3f3f46;
        --text-primary: #f8fafc;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
    }

    .dent-schedule-container {
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding: 24px;
        border-radius: 16px;
        direction: rtl;
        max-width: 760px;
        margin: 0 auto;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .dent-schedule-title {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 32px;
        color: var(--text-primary);
        border-bottom: none;
        letter-spacing: -0.01em;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 40px;
    }
    
    .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
    }
    .stat-title {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
        display: block;
    }
    .stat-value {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        display: block;
    }
    .stat-subvalue {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 4px;
        display: block;
    }

    /* Timeline Container */
    .timeline {
        position: relative;
        padding-right: 140px;
    }
    .timeline::before {
        content: '';
        position: absolute;
        right: 120px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--border-color);
    }

    /* Month Header */
    .timeline-month {
        /* Wrapper for the month text and its events */
    }
    .month-header {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 32px 0 20px 0;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .timeline-month:first-child .month-header { margin-top: 0; }
    .month-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }
    
    .timeline-events {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Event Wrapper */
    .event {
        position: relative;
    }
    
    /* Date Area (Right side of timeline) */
    .event-date {
        position: absolute;
        right: -140px;
        top: 50%;
        transform: translateY(-50%);
        width: 105px;
        text-align: left;
    }
    .date-main { margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .day-name { font-size: 0.8rem; color: var(--text-secondary); display: block; }
    .gregorian { font-weight: 500; font-size: 0.95rem; color: var(--text-primary); font-family: 'Outfit'; display: block; line-height: 1.2; }
    .hijri { font-size: 0.75rem; color: var(--text-muted); display: block; line-height: 1.3; }
    
    /* Timeline Dot */
    .event-dot {
        position: absolute;
        right: -24px;
        top: 50%;
        transform: translateY(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        border: 2px solid var(--bg-color);
        z-index: 2;
        transition: all 0.2s ease;
    }
    .event.highlight .event-dot { background: var(--text-primary); border-color: #27272a; box-shadow: 0 0 0 2px var(--bg-color); }
    .event.passed .event-dot { background: transparent; border-color: var(--border-color); }
    
    /* Event Card (Left side of timeline) */
    .event-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        position: relative;
        transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }
    .event-card:hover {
        border-color: var(--border-hover);
        background-color: var(--card-hover-bg);
        transform: translateX(-3px);
    }
    .event.highlight .event-card { border-color: rgba(255,255,255,0.15); }
    .event.passed .event-card { opacity: 0.6; }
    .event.passed .event-card:hover { opacity: 0.8; }
    
    .event-info {
        flex: 1;
    }
    .event-title { 
        font-weight: 500; 
        font-size: 1.05rem; 
        line-height: 1.4; 
        color: var(--text-primary) !important; 
        margin: 0; 
        text-align: right;
    }
    
    .event-badges {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        min-width: 90px;
    }
    
    .badge {
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        white-space: nowrap;
    }
    .badge.highlight-badge {
        color: var(--text-primary);
        border-color: rgba(255,255,255,0.2);
        font-weight: 500;
    }
    .badge.passed-badge {
        background: transparent;
        border-style: dashed;
    }
    
    /* Admin controls inside badges */
    .event-delete-btn {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        padding: 0;
        line-height: 1;
        transition: all 0.2s ease;
        margin-top: 4px;
    }
    .event-delete-btn:hover { background: rgba(239, 68, 68, 0.25); color: #ffffff; }

    /* Empty state */
    .schedule-loading, .schedule-error {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .dent-schedule-container {
            padding: 16px 12px;
        }
        .stats-grid {
            grid-template-columns: repeat(1, 1fr);
            gap: 8px;
        }
        .timeline {
            padding-right: 90px;
        }
        .timeline::before {
            right: 70px;
        }
        .event-date {
            right: -90px;
            width: 60px;
        }
        .gregorian { font-size: 0.8rem; }
        .day-name, .hijri { font-size: 0.65rem; }
        .event-dot {
            right: -24px; /* relative to padding edge of timeline */
        }
        .event-card {
            padding: 12px;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .event-badges {
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
        }
    }
</style>

<!-- HTML STRUCTURE -->
<div class="dent-schedule-container" id="dent-schedule-app">
    <h2 class="dent-schedule-title">التقويم الدراسي</h2>
    
    <div class="stats-grid" id="schedule-stats" style="display: none;">
        <div class="stat-card" id="stat-exam">
            <span class="stat-title">أقرب حدث</span>
            <span class="stat-value" id="val-exam">لا يوجد</span>
            <span class="stat-subvalue">في التقويم</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">الأيام المتبقية للترم</span>

        </div>

            <span class="stat-value" id="val-vacation">انتهت</span>

    </div>

    <div class="timeline" id="schedule-content">

    </div>
</div>
