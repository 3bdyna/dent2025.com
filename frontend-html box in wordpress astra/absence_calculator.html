<!-- absence_calculator.html (Dent2025 Absence & Denial Calculator) -->
<style>
    /* --------------------------------------------------
       1. BANNER STYLES (Exact match to GPA & Timer Banners)
       -------------------------------------------------- */
    .dent-absence-banner {
        background: #1e1e1e !important;

        padding: 14px 20px !important;
        border-radius: 14px !important;
        color: #f8fafc !important;
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        cursor: pointer !important;
        direction: rtl !important;
        transition: all 0.25s ease !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 10px 0 !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important;
        box-sizing: border-box !important;
        overflow: hidden !important;

    }

        flex: 1 !important;
        text-align: right !important;
    }
    .dent-absence-banner-text h3 {
        margin: 0 !important;
        font-size: 1.05rem !important;
        font-weight: 700 !important;
        color: #f8fafc !important;
    }
    .dent-absence-banner-text p {
        margin: 3px 0 0 0 !important;
        font-size: 0.82rem !important;
        color: #9ca3af !important;
    }
    .dent-absence-banner-arrow {
        color: #f8fafc !important;
        font-size: 1.1rem !important;
        font-weight: bold !important;
        background: rgba(255, 255, 255, 0.06) !important;
        width: 36px !important;
        height: 36px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 50% !important;
        transition: all 0.2s ease !important;
        flex-shrink: 0 !important;
    }
    .dent-absence-banner:hover .dent-absence-banner-arrow {
        background: rgba(255, 255, 255, 0.15) !important;
        transform: scale(1.05) !important;
    }

    /* --------------------------------------------------
       2. MODAL OVERLAY & CONTAINER (Body-attached, Centered)
       -------------------------------------------------- */
    .dent-absence-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: rgba(0, 0, 0, 0.82) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 9999999 !important;
        display: none !important;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.25s ease;
        padding: 16px;
        box-sizing: border-box;
        margin: 0 !important;
    }
    .dent-absence-overlay.active {
        display: flex !important;
        opacity: 1;
    }
    .dent-absence-modal {
        background: #18181b;
        color: #f8fafc;
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        padding: 24px;
        border-radius: 18px;
        direction: rtl;
        width: 100%;
        max-width: 520px;
        max-height: 88vh;
        overflow-y: auto;
        /* Completely Hide Scrollbars across all browsers */
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        position: relative;
        transform: translateY(20px);
        transition: transform 0.25s ease;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-sizing: border-box;
    }
    .dent-absence-modal::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
    }
    .dent-absence-overlay.active .dent-absence-modal {
        transform: translateY(0);
    }

    /* Close Button */
    .dent-absence-close {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e2e8f0;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 1.3rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        line-height: 1;
    }
    .dent-absence-close:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
    }

    /* Header */
    .dent-absence-header {
        margin-bottom: 16px;
        padding-left: 36px; /* Avoid overlapping close button */
    }
    .dent-absence-title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: #f8fafc;
    }
    .dent-absence-subtitle {
        margin: 3px 0 0 0;
        font-size: 0.82rem;
        color: #94a3b8;

    /* Minimal Settings Bar */
    .dent-absence-settings {

        justify-content: space-between;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;

    /* Clean Subject Card */
    .dent-absence-card {

        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;

    }
    .dent-absence-card-top {
        display: flex;

        align-items: center;

    .dent-absence-sub-name {

        font-size: 0.92rem;
        font-weight: 600;
        color: #f8fafc;
        line-height: 1.35;

    /* Stepper Controls */
    .dent-absence-stepper {

        align-items: center;

    }
    .dent-step-btn {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f8fafc;

        height: 32px;
        border-radius: 8px;

        align-items: center;
        justify-content: center;

        background: rgba(255, 255, 255, 0.16);
    }
    .dent-step-btn:active {
        transform: scale(0.95);
    }
    .dent-step-input {
        width: 44px;

        text-align: center;
        background: #1e1e1e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        border-radius: 8px;
        font-size: 0.92rem;
        font-weight: 600;
        font-family: inherit;
        -moz-appearance: textfield;
    }
    .dent-step-input::-webkit-outer-spin-button,
    .dent-step-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Minimal Progress Bar */
    .dent-absence-progress-bg {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 3px;
        overflow: hidden;
        margin: 8px 0 6px 0;
    }
    .dent-absence-progress-fill {
        height: 100%;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.35);
        transition: width 0.25s ease;
    }

    /* Status & Stats Footer */
    .dent-absence-footer-stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: #94a3b8;

    /* Collapsible Quick Calc Drawer */
    .dent-quick-toggle {

        color: #94a3b8;
        width: 100%;
        padding: 8px;

        font-size: 0.78rem;
        font-family: inherit;

        border: 1px solid rgba(255, 255, 255, 0.08);

    .dent-quick-field {
        margin-bottom: 8px;
    }
    .dent-quick-label {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8;

    }
    .dent-quick-input {
        width: 100%;
        background: #1e1e1e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        font-family: inherit;
        box-sizing: border-box;
    }
</style>

<!-- Main Page Banner -->
<div class="dent-absence-banner" onclick="openAbsenceModal()">
    <div class="dent-absence-banner-text">
        <h3>حاسبة الغياب</h3>
        <p>متابعة نسبة الغياب والمتبقي قبل الحرمان لمواد الفصل</p>

</div>

<!-- Modal Dialog -->
<div class="dent-absence-overlay" id="dentAbsenceModal" onclick="closeAbsenceOnBgClick(event)">
    <div class="dent-absence-modal">
        <button type="button" class="dent-absence-close" onclick="closeAbsenceModal()" title="إغلاق">×</button>

        <div class="dent-absence-header">
            <h2 class="dent-absence-title">حاسبة الغياب</h2>
            <div class="dent-absence-subtitle" id="dent-absence-subtitle">مواد الفصل الحالي</div>
        </div>

        <!-- Minimal Settings Row -->
        <div class="dent-absence-settings">
            <div style="display: flex; align-items: center; gap: 6px;">
                <label for="dent-sem-weeks">أسابيع الفصل:</label>
                <select id="dent-sem-weeks" class="dent-absence-select" onchange="onSemesterWeeksChange(this.value)">
                    <option value="10">10 أسابيع</option>
                    <option value="11">11 أسبوع</option>
                    <option value="12">12 أسبوع</option>
                    <option value="13">13 أسبوع</option>
                    <option value="14" selected>14 أسبوع</option>
                    <option value="15">15 أسبوع</option>
                    <option value="16">16 أسبوع</option>
                </select>
            </div>
            <button type="button" onclick="addCustomAbsenceSubject()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; font-family: inherit;">+ إضافة مادة</button>
        </div>

        <!-- Subjects Container -->
        <div id="dent-absence-subjects-container">
            <div style="text-align: center; color: #9ca3af; padding: 20px; font-size: 0.85rem;">
                جاري تحميل مواد الفصل...
            </div>
        </div>

        <!-- Minimal Collapsible Quick Calculator -->
        <button type="button" class="dent-quick-toggle" onclick="toggleQuickCalcDrawer()">+ حساب مقرر خارجي أو مخصص</button>
        <div class="dent-quick-body" id="dent-quick-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;" class="dent-quick-field">

                    <label class="dent-quick-label">المحاضرات أسبوعياً</label>
                    <input type="number" id="quick-weekly-sessions" class="dent-quick-input" min="1" max="15" value="2" oninput="calculateQuickAbsence()">
                </div>
                <div>
                    <label class="dent-quick-label">أسابيع الفصل</label>
                    <input type="number" id="quick-weeks-count" class="dent-quick-input" min="1" max="20" value="14" oninput="calculateQuickAbsence()">
                </div>

                <label class="dent-quick-label">عدد مرات الغياب</label>
                <input type="number" id="quick-current-absence" class="dent-quick-input" min="0" max="100" value="1" oninput="calculateQuickAbsence()">
            </div>

        </div>
    </div>
</div>

<script>
    let dentAbsenceSelection = null;
    let dentAbsenceSubjects = [];
    let dentAbsenceWeeks = 14;
    let dentAbsenceClassSchedule = [];

    function openAbsenceModal() {
        const modal = document.getElementById('dentAbsenceModal');
        if (modal) {
            // Attach modal to body so it escapes Astra's layout column container
            if (modal.parentNode !== document.body) {
                document.body.appendChild(modal);
            }
            modal.style.setProperty('display', 'flex', 'important');
            void modal.offsetWidth; // Force layout recalculation
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            initAbsenceEngine();
        }
    }

    function closeAbsenceModal() {
        const modal = document.getElementById('dentAbsenceModal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(function() {
                if (!modal.classList.contains('active')) {
                    modal.style.setProperty('display', 'none', 'important');
                }
            }, 250);
        }
    }

    function closeAbsenceOnBgClick(e) {
        if (e.target.id === 'dentAbsenceModal') {
            closeAbsenceModal();
        }
    }

    function toggleQuickCalcDrawer() {
        const body = document.getElementById('dent-quick-body');
        if (!body) return;
        const isShown = body.style.display === 'block';
        body.style.display = isShown ? 'none' : 'block';
        if (!isShown) calculateQuickAbsence();
    }

    function onSemesterWeeksChange(val) {
        dentAbsenceWeeks = parseInt(val) || 14;
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function getAbsenceStorageKey() {
        if (dentAbsenceSelection && dentAbsenceSelection.specialty) {
            return `dent2025_absence_${dentAbsenceSelection.specialty}_y${dentAbsenceSelection.year}_s${dentAbsenceSelection.semester}`;
        }
        return 'dent2025_absence_general';
    }

    function initAbsenceEngine() {
        const rawSel = localStorage.getItem('dent2025_selection');
        if (rawSel) {
            try {
                dentAbsenceSelection = JSON.parse(rawSel);
            } catch(e) {
                dentAbsenceSelection = null;
            }
        }

        const subTitleEl = document.getElementById('dent-absence-subtitle');
        if (subTitleEl) {
            if (dentAbsenceSelection && dentAbsenceSelection.specialty) {
                const specName = dentAbsenceSelection.specialty === 'dentistry' ? 'طب الأسنان' : (dentAbsenceSelection.specialty === 'medicine' ? 'الطب البشري' : 'التحضيري');
                const yrSem = dentAbsenceSelection.specialty === 'pre-med' ? `الفصل ${dentAbsenceSelection.semester}` : `السنة ${dentAbsenceSelection.year} - الفصل ${dentAbsenceSelection.semester}`;
                subTitleEl.innerText = `${specName} (${yrSem})`;
            } else {
                subTitleEl.innerText = `مواد الفصل الحالي`;
            }
        }

        loadAbsenceData();
    }

    function loadAbsenceData() {
        const apiBase = (window.location.pathname === '/dev' || window.location.pathname.startsWith('/dev/')) ? '/dev' : '';
        
        let classPromise = Promise.resolve([]);
        if (dentAbsenceSelection) {
            classPromise = fetch(`${apiBase}/dent2025_api.php?action=get_classes`)
                .then(r => r.json())
                .then(res => (res.success && Array.isArray(res.data)) ? res.data : [])
                .catch(() => []);
        }

        let subjectsPromise = Promise.resolve([]);
        if (dentAbsenceSelection) {
            const cacheKey = `dent2025_dashboard_data_${dentAbsenceSelection.specialty}_${dentAbsenceSelection.year}_${dentAbsenceSelection.semester}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed && Array.isArray(parsed.subjects)) {
                        subjectsPromise = Promise.resolve(parsed.subjects);
                    }
                } catch(e){}
            } else {
                subjectsPromise = fetch(`${apiBase}/dent2025_api.php?action=data&specialty=${dentAbsenceSelection.specialty}&year=${dentAbsenceSelection.year}&semester=${dentAbsenceSelection.semester}`)
                    .then(r => r.json())
                    .then(res => (res.success && res.data && Array.isArray(res.data.subjects)) ? res.data.subjects : [])
                    .catch(() => []);
            }
        }

        Promise.all([subjectsPromise, classPromise]).then(([subjects, classes]) => {
            dentAbsenceClassSchedule = classes || [];
            buildAbsenceSubjectsList(subjects || []);
        });
    }

    function buildAbsenceSubjectsList(apiSubjects) {
        dentAbsenceSubjects = [];

        const storageKey = getAbsenceStorageKey();
        let savedState = null;
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) savedState = JSON.parse(raw);
        } catch(e){}

        if (savedState && savedState.weeks) {
            dentAbsenceWeeks = parseInt(savedState.weeks) || 14;
            const selEl = document.getElementById('dent-sem-weeks');
            if (selEl) selEl.value = String(dentAbsenceWeeks);
        }

        const selectedGroup = localStorage.getItem('dent2025_selected_group') || 'المجموعة A';

        const relevantClasses = dentAbsenceClassSchedule.filter(c => {
            if (!dentAbsenceSelection) return false;
            const matchSpec = String(c.specialty).toLowerCase() === String(dentAbsenceSelection.specialty).toLowerCase();
            const matchYear = parseInt(c.year) === parseInt(dentAbsenceSelection.year);
            const matchSem = parseInt(c.semester) === parseInt(dentAbsenceSelection.semester);
            const matchGroup = (!c.group_name || c.group_name === 'الدفعة كاملة' || c.group_name === selectedGroup);
            return matchSpec && matchYear && matchSem && matchGroup;
        });

        if (apiSubjects.length === 0 && (!savedState || !savedState.customSubjects || savedState.customSubjects.length === 0)) {
            if (!dentAbsenceSelection) {
                apiSubjects = [
                    { id: "s1", name: "تشخيص الفم (Oral Diagnosis)", hours: 2 },
                    { id: "s2", name: "علم الأمراض العام (General Pathology)", hours: 3 },
                    { id: "s3", name: "الأحياء الدقيقة (Microbiology)", hours: 3 }
                ];
            }
        }

        apiSubjects.forEach((sub, idx) => {
            let weeklySessions = 0;
            const matchedClasses = relevantClasses.filter(c => {
                return c.subject && (c.subject.includes(sub.name) || sub.name.includes(c.subject));
            });

            if (matchedClasses.length > 0) {
                weeklySessions = matchedClasses.length;
            } else {
                let parsedHours = 2;
                if (typeof sub.hours === 'string') {
                    const tMatch = sub.hours.match(/(\d+)\s*نظري/);
                    const pMatch = sub.hours.match(/(\d+)\s*عملي/);
                    const th = tMatch ? parseInt(tMatch[1]) : 0;
                    const pr = pMatch ? parseInt(pMatch[1]) : 0;
                    if (th > 0 || pr > 0) parsedHours = th + pr;
                    else parsedHours = parseInt(sub.hours) || 2;
                } else {
                    parsedHours = parseInt(sub.hours) || 2;
                }
                weeklySessions = parsedHours > 0 ? parsedHours : 2;
            }

            let savedAbsence = 0;
            if (savedState && savedState.subjects && savedState.subjects[sub.id || idx]) {
                const s = savedState.subjects[sub.id || idx];
                if (s.absences !== undefined) savedAbsence = parseInt(s.absences) || 0;
                if (s.weeklySessions !== undefined) weeklySessions = parseInt(s.weeklySessions) || weeklySessions;
            }

            dentAbsenceSubjects.push({
                id: sub.id || `sub_${idx}`,
                name: sub.name || `مادة ${idx + 1}`,
                weeklySessions: weeklySessions,
                absences: savedAbsence,
                isCustom: false
            });
        });

        if (savedState && Array.isArray(savedState.customSubjects)) {
            savedState.customSubjects.forEach(cSub => {
                dentAbsenceSubjects.push({
                    id: cSub.id || `custom_${Date.now()}_${Math.random()}`,
                    name: cSub.name || 'مادة إضافية',
                    weeklySessions: parseInt(cSub.weeklySessions) || 2,
                    absences: parseInt(cSub.absences) || 0,
                    isCustom: true
                });
            });
        }

        renderAbsenceSubjects();
    }

    function renderAbsenceSubjects() {
        const container = document.getElementById('dent-absence-subjects-container');
        if (!container) return;

        if (dentAbsenceSubjects.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; color: #9ca3af; padding: 18px; font-size: 0.85rem;">
                    لا توجد مواد مسجلة لهذا الفصل حتى الآن.<br>
                    يمكنك إضافة مادة يدوياً بالضغط على زر "+ إضافة مادة" أعلاه.
                </div>
            `;
            return;
        }

        let html = '';
        dentAbsenceSubjects.forEach((sub, idx) => {
            const totalSessions = Math.max(1, (sub.weeklySessions || 1) * dentAbsenceWeeks);
            const absences = Math.max(0, sub.absences || 0);
            const percentage = ((absences / totalSessions) * 100);
            const dnThresholdCount = Math.floor(totalSessions * 0.25);

            let statusLabel = '';
            let remainingText = '';

            if (percentage >= 25.0) {
                statusLabel = 'حرمان (DN)';
                remainingText = `تجاوزت الحد (${dnThresholdCount} غيابات)`;
            } else if (percentage >= 20.0) {
                statusLabel = 'إنذار ثاني';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            } else if (percentage >= 10.0) {
                statusLabel = 'إنذار أول';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            } else {
                statusLabel = 'آمن';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            }

            const clampedProgress = Math.min(100, percentage);
            const safeName = String(sub.name || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));

            const deleteBtn = sub.isCustom ? `<button type="button" onclick="removeAbsenceSubject(${idx})" title="حذف" style="background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 1.1rem; padding: 0 4px;">×</button>` : '';

            html += `
                <div class="dent-absence-card">
                    <div class="dent-absence-card-top">
                        <div style="flex: 1; min-width: 0;">
                            ${sub.isCustom ? `<input type="text" value="${safeName}" onchange="updateAbsenceSubName(${idx}, this.value)" style="width: 100%; font-size: 0.88rem; padding: 2px 6px; background: #1e1e1e; color: #f8fafc; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;" placeholder="اسم المادة">` : `<h4 class="dent-absence-sub-name" title="${safeName}">${safeName}</h4>`}
                            <div class="dent-absence-sub-meta">
                                <input type="number" min="1" max="15" value="${sub.weeklySessions}" onchange="updateAbsenceWeeklySessions(${idx}, this.value)" style="width: 28px; background: #18181b; border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; border-radius: 4px; text-align: center; font-size: 0.72rem; padding: 1px;"> حصص/أسبوع • الإجمالي: ${totalSessions} • حد الحرمان: ${dnThresholdCount}
                            </div>
                        </div>
                        <div class="dent-absence-stepper">
                            <button type="button" class="dent-step-btn" onclick="stepAbsence(${idx}, -1)">−</button>
                            <input type="number" class="dent-step-input" min="0" max="${totalSessions}" value="${absences}" onchange="setAbsenceCount(${idx}, this.value)">
                            <button type="button" class="dent-step-btn" onclick="stepAbsence(${idx}, 1)">+</button>
                            ${deleteBtn}
                        </div>
                    </div>

                    <!-- Minimal Progress Bar -->
                    <div class="dent-absence-progress-bg">
                        <div class="dent-absence-progress-fill" style="width: ${clampedProgress}%;"></div>
                    </div>

                    <!-- Stats Footer -->
                    <div class="dent-absence-footer-stats">
                        <div>الغياب: ${absences}/${totalSessions} (${percentage.toFixed(1)}%) • <span class="dent-absence-status-text">${statusLabel}</span></div>
                        <div>${remainingText}</div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function stepAbsence(idx, delta) {
        if (!dentAbsenceSubjects[idx]) return;
        const cur = parseInt(dentAbsenceSubjects[idx].absences) || 0;
        dentAbsenceSubjects[idx].absences = Math.max(0, cur + delta);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function setAbsenceCount(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].absences = Math.max(0, parseInt(val) || 0);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function updateAbsenceWeeklySessions(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].weeklySessions = Math.max(1, parseInt(val) || 1);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function updateAbsenceSubName(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].name = val || 'مادة جديدة';
        saveAbsenceState();
    }

    function addCustomAbsenceSubject() {
        dentAbsenceSubjects.push({
            id: `custom_${Date.now()}`,
            name: 'مادة إضافية',
            weeklySessions: 2,
            absences: 0,
            isCustom: true
        });
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function removeAbsenceSubject(idx) {
        dentAbsenceSubjects.splice(idx, 1);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function saveAbsenceState() {
        const storageKey = getAbsenceStorageKey();
        const state = {
            weeks: dentAbsenceWeeks,
            subjects: {},
            customSubjects: []
        };

        dentAbsenceSubjects.forEach(sub => {
            if (sub.isCustom) {
                state.customSubjects.push(sub);
            } else {
                state.subjects[sub.id] = {
                    absences: sub.absences,
                    weeklySessions: sub.weeklySessions
                };
            }
        });

        try {
            localStorage.setItem(storageKey, JSON.stringify(state));
        } catch(e){}
    }

    function calculateQuickAbsence() {
        const weeklyInput = document.getElementById('quick-weekly-sessions');
        const weeksInput = document.getElementById('quick-weeks-count');
        const absenceInput = document.getElementById('quick-current-absence');
        const resultBox = document.getElementById('quick-calc-result');
        if (!resultBox) return;

        const weekly = Math.max(1, parseInt(weeklyInput ? weeklyInput.value : 2) || 2);
        const weeks = Math.max(1, parseInt(weeksInput ? weeksInput.value : 14) || 14);
        const absences = Math.max(0, parseInt(absenceInput ? absenceInput.value : 0) || 0);

        const total = weekly * weeks;
        const pct = ((absences / total) * 100);
        const dn = Math.floor(total * 0.25);
        const left = Math.max(0, dn - absences);

        resultBox.innerHTML = `
            الإجمالي: <strong>${total}</strong> حصة (${weekly} أسبوعياً × ${weeks} أسبوع) • حد الحرمان: <strong>${dn}</strong><br>
            نسبة الغياب: <strong>${pct.toFixed(1)}%</strong> • متبقي: <strong>${left}</strong> غيابات قبل الحرمان
        `;
    }
</script>
