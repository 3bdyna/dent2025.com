        <div class="dent-absence-settings">

            <button type="button" class="dent-absence-btn-add" onclick="addCustomAbsenceSubject()">+ إضافة مادة</button>

                الأسبوع الحالي: 1 • متبقي 17 أسبوعاً للاختبارات
            </div>

        <!-- Quick Day Absence Logger (From Timetable Schedule) -->
        <div class="dent-absence-day-bar">

                <select id="dent-day-skip-select" class="dent-absence-select" style="min-width: 100px;">
                    <option value="">-- اختر اليوم --</option>
                    <option value="الأحد">الأحد</option>
                    <option value="الاثنين">الاثنين</option>
                    <option value="الثلاثاء">الثلاثاء</option>
                    <option value="الأربعاء">الأربعاء</option>
                    <option value="الخميس">الخميس</option>

            </div>
            <button type="button" class="dent-absence-btn-add" onclick="applyDayAbsence()">تسجيل غياب اليوم (+1)</button>
        </div>

        <!-- Live Structured Day Feedback Card -->
        <div id="dent-day-feedback" class="dent-day-feedback-container"></div>

        <!-- Subjects Container -->
        <div id="dent-absence-subjects-container">
            <div style="text-align: center; color: #9ca3af; padding: 16px; font-size: 0.82rem;">
                جاري تحميل مواد الفصل...
            </div>
        </div>

        <!-- Collapsible Quick Calculator -->
        <button type="button" class="dent-quick-toggle" onclick="toggleQuickCalcDrawer()">+ حساب مقرر خارجي أو مخصص</button>
        <div class="dent-quick-body" id="dent-quick-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;" class="dent-quick-field">
                <div>
                    <label class="dent-quick-label">المحاضرات أسبوعياً</label>
                    <input type="number" id="quick-weekly-sessions" class="dent-quick-input" min="1" max="15" value="2" oninput="calculateQuickAbsence()">
                </div>
                <div>
                    <label class="dent-quick-label">أسابيع الفصل</label>
                    <input type="number" id="quick-weeks-count" class="dent-quick-input" min="1" max="20" value="17" oninput="calculateQuickAbsence()">
                </div>
            </div>
            <div class="dent-quick-field">
                <label class="dent-quick-label">عدد مرات الغياب</label>
                <input type="number" id="quick-current-absence" class="dent-quick-input" min="0" max="100" value="1" oninput="calculateQuickAbsence()">
            </div>
            <div id="quick-calc-result" style="font-size: 0.76rem; color: #cbd5e1; margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.06);"></div>
        </div>
    </div>
</div>

<script>
    let dentAbsenceSelection = null;
    let dentAbsenceSubjects = [];
    let dentAbsenceWeeks = 17;
    let dentAbsenceClassSchedule = [];
    let lastLoggedDayAbsences = null;

    const SEMESTER_START_DATE = new Date('2026-08-23T00:00:00');
    const SEMESTER_EXAM_DATE = new Date('2026-12-20T00:00:00');

    // Arabic normalization helper
    function normAr(str) {
        if (!str) return '';
        return String(str)
            .trim()
            .toLowerCase()
            .replace(/[إأآا]/g, 'ا')
            .replace(/[ة]/g, 'ه')
            .replace(/[يى]/g, 'ي')
            .replace(/[\s\-_()&/]/g, '');
    }

    function isDayEqual(d1, d2) {
        const n1 = normAr(d1);
        const n2 = normAr(d2);
        return n1 === n2 || n1.includes(n2) || n2.includes(n1);
    }

    function isGroupEqual(cGroup, studentGroup) {
        if (!cGroup) return true;
        const cg = normAr(cGroup);
        const sg = normAr(studentGroup);
        if (cg === 'الدفعهكامله' || cg === 'الكل' || cg === 'كلالدفعه' || !sg || sg === 'الدفعهكامله') return true;
        return cg === sg || cg.includes(sg) || sg.includes(cg);
    }

    function cleanTokens(text) {
        if (!text) return [];
        return String(text)
            .toLowerCase()
            .replace(/&/g, ' and ')
            .replace(/[إأآا]/g, 'ا')
            .replace(/[ة]/g, 'ه')
            .replace(/[يى]/g, 'ي')
            .replace(/[^a-z0-9\u0600-\u06FF\s]/g, ' ')
            .split(/\s+/)
            .filter(t => t.length > 2 && !['and', 'the', 'for', 'with', 'pre', 'clinical', 'general', 'advanced', 'department', 'course', 'مقرر', 'مادة', 'طب', 'عام', 'متقدم'].includes(t));
    }

    // Official Jazan University Course Contact Hours Catalog (Matches Portal Percentages Exactly)
    function getJazanUniversityCourseDefaults(subName, specialty, year) {
        if (!subName) return null;
        const clean = normAr(subName);

        // --- 3 YEARLY COURSES (Run Both Semesters) ---
        // 1. PRO341 / 341عاض - Pre-clinical Removable Prosthodontics (Total: 54.0 contact hrs -> 1 absence = 1.85%)
        if (clean.includes('341') || clean.includes('pro341') || clean.includes('عاض') || clean.includes('استعاض') || clean.includes('prostho')) {
            return { weeklySessions: 3, totalSessions: 54.0, isYearly: true };
        }
        // 2. OPT321 / 321صحح - Pre-clinical Restorative / Operative Dentistry (Total: 34.36 contact hrs -> 1 absence = 2.91%)
        if (clean.includes('321') || clean.includes('opt321') || clean.includes('صحح') || clean.includes('اصحاح') || clean.includes('تحفظي') || clean.includes('restor') || clean.includes('operat')) {
            return { weeklySessions: 2, totalSessions: 34.36, isYearly: true };
        }
        // 3. DMS353 / 353طبب / 361طبب - Pharmacology (Total: 34.36 contact hrs -> 1 absence = 2.91%)
        if (clean.includes('353') || clean.includes('dms353') || clean.includes('361') || clean.includes('ادوي') || clean.includes('pharma')) {
            return { weeklySessions: 2, totalSessions: 34.36, isYearly: true };
        }

        // --- 6 SEMESTER 1 ONLY COURSES (End This Semester) ---
        // 1. DIG311 / 311شخص - Oral & Maxillofacial Radiology (Total: 19.34 contact hrs -> 1 absence = 5.17%)
        if (clean.includes('311') || clean.includes('dig311') || clean.includes('شخص') || clean.includes('اشع') || clean.includes('radio') || clean.includes('radiology')) {
            return { weeklySessions: 1, totalSessions: 19.34, isYearly: false };
        }
        // 2. DMS351 / 351طبب - General Pathology (Total: 30.0 contact hrs -> 1 absence = 3.33%)
        if (clean.includes('351') || clean.includes('dms351') || clean.includes('امراض') || clean.includes('patho') || clean.includes('pathology')) {
            return { weeklySessions: 2, totalSessions: 30.0, isYearly: false };
        }
        // 3. DMS352 / 352طبب - Oral Microbiology & Immunology (Total: 23.64 contact hrs -> 1 absence = 4.23%)
        if (clean.includes('352') || clean.includes('dms352') || clean.includes('ميكرو') || clean.includes('احياءدقيق') || clean.includes('microbio') || clean.includes('immunol') || clean.includes('مناع')) {
            return { weeklySessions: 2, totalSessions: 23.64, isYearly: false };
        }
        // 4. DIG313-2 / 313شخص - Oral Diagnosis
        if (clean.includes('313') || clean.includes('dig313') || clean.includes('تشخيص') || clean.includes('diagno') || clean.includes('diagnosis')) {
            return { weeklySessions: 2, totalSessions: 34.0, isYearly: false };
        }
        // 5. PRO322 / 322عاض / 331صحح - Advanced Dental Biomaterials
        if (clean.includes('322') || clean.includes('pro322') || clean.includes('331') || clean.includes('مواد') || clean.includes('biomat')) {
            return { weeklySessions: 2, totalSessions: 34.0, isYearly: false };
        }
        // 6. DPH331 / 331صح / 371طبب - Dental Public Health
        if (clean.includes('dph') || clean.includes('dph331') || clean.includes('371') || clean.includes('صحه') || clean.includes('صح') || clean.includes('health') || clean.includes('publichealth')) {
            return { weeklySessions: 2, totalSessions: 34.0, isYearly: false };
        }

        return null;
    }

    // Auto-detect yearly / extended courses based on Jazan University curricula
    function isAutoYearlySubject(subName, specialty, year) {
        if (!subName) return false;
        if (specialty === 'pre-med' || parseInt(year) === 0) return false;

        const defaults = getJazanUniversityCourseDefaults(subName, specialty, year);
        if (defaults && defaults.isYearly !== undefined) return defaults.isYearly;

        const yearlyKeywords = [
            'prostho', 'استعاضة', 'استعاضه', 'تركيبات',
            'restorative', 'operative', 'تحفظي', 'حشوات',
            'pharmacology', 'أدوية', 'ادوية', 'فارماكولوجي',
            'periodont', 'لثة', 'لثه',
            'orthodont', 'تقويم',
            'pediatric', 'pedodont', 'أطفال', 'اطفال',
            'surgery', 'جراحة', 'جراحه',
            'endodont', 'عصب', 'جذور',
            'anatomy', 'تشريح',
            'physiology', 'وظائف الأعضاء', 'وظائف الاعضاء',
            'biochemistry', 'كيمياء حيوية', 'كيمياء حيويه',
            'oral biology', 'أحياء الفم', 'احياء الفم',
            'medicine', 'clerkship', 'باطنة', 'باطنه', 'نساء وتوليد'
        ];

        const clean = normAr(subName);
        return yearlyKeywords.some(kw => clean.includes(normAr(kw)));
    }

    // Smart Multi-Tier Subject Matcher
    function isSubjectMatch(cSub, sName) {
        if (!cSub || !sName) return false;
        
        // 1. Normalized direct match
        const cClean = normAr(cSub.replace(/&/g, ' and '));
        const sClean = normAr(sName.replace(/&/g, ' and '));
        if (cClean === sClean || cClean.includes(sClean) || sClean.includes(cClean)) return true;

        // 2. Token overlap
        const cTokens = cleanTokens(cSub);
        const sTokens = cleanTokens(sName);
        for (let ct of cTokens) {
            for (let st of sTokens) {
                if (ct === st || (ct.length >= 4 && st.length >= 4 && (ct.includes(st) || st.includes(ct)))) return true;
            }
        }

        // 3. Domain dictionary mapping (English <-> Arabic / Key roots)
        const roots = [
            ['radio', 'اشعه', 'radiology', 'xray', 'maxillofacial'],
            ['microbio', 'احياء', 'ميكرو', 'microbiology', 'immunology', 'مناعه'],
            ['prostho', 'استعاضه', 'تركيبات', 'prosthodontics', 'removable', 'fixed'],
            ['patho', 'امراض', 'باثولوجي', 'pathology'],
            ['diagno', 'تشخيص', 'diagnosis'],
            ['biomat', 'مواد', 'biomaterial', 'biomaterials'],
            ['resto', 'operat', 'تحفظي', 'حشوات', 'restorative', 'operative'],
            ['perio', 'لثه', 'periodont', 'periodontology'],
            ['ortho', 'تقويم', 'orthodont', 'orthodontics'],
            ['pedo', 'اطفال', 'pediatric', 'pedodontics'],
            ['endo', 'عصب', 'جذور', 'endodont', 'endodontics'],
            ['surg', 'جراحه', 'surgery'],
            ['pharma', 'ادويه', 'فارما', 'pharmacology'],
            ['anat', 'تشريح', 'anatomy'],
            ['physio', 'وظائف', 'physiology'],
            ['histo', 'انسجه', 'histology'],
            ['biochem', 'كيمياء', 'biochemistry'],
            ['health', 'صحه', 'publichealth', 'community']
        ];

        const cFull = (cSub + ' ' + cClean).toLowerCase();
        const sFull = (sName + ' ' + sClean).toLowerCase();

        for (let group of roots) {
            const cHas = group.some(r => cFull.includes(r));
            const sHas = group.some(r => sFull.includes(r));
            if (cHas && sHas) return true;
        }

        return false;
    }

    function updateSemesterTimelineInfo() {
        const infoEl = document.getElementById('dent-absence-timeline-info');
        if (!infoEl) return;

        const now = new Date();
        const msPerDay = 24 * 60 * 60 * 1000;

        let curWeek = 1;
        if (now >= SEMESTER_START_DATE) {
            const diffDays = Math.floor((now - SEMESTER_START_DATE) / msPerDay);
            curWeek = Math.max(1, Math.floor(diffDays / 7) + 1);
        }

        let remainingWeeks = 17;
        if (now < SEMESTER_EXAM_DATE) {
            const daysToExams = Math.max(0, Math.ceil((SEMESTER_EXAM_DATE - now) / msPerDay));
            remainingWeeks = Math.ceil(daysToExams / 7);
        } else {
            remainingWeeks = 0;
        }

        infoEl.innerHTML = `الأسبوع الحالي: ${curWeek} • متبقي ${remainingWeeks} أسبوعاً للاختبارات`;
    }

    function openAbsenceModal() {
        const modal = document.getElementById('dentAbsenceModal');
        if (modal) {
            if (modal.parentNode !== document.body) {
                document.body.appendChild(modal);
            }
            modal.style.setProperty('display', 'flex', 'important');
            void modal.offsetWidth;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateSemesterTimelineInfo();
            initAbsenceEngine();
        }
    }

    function closeAbsenceModal() {
        const modal = document.getElementById('dentAbsenceModal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(function() {
                if (!modal.classList.contains('active')) {
                    modal.style.setProperty('display', 'none', 'important');
                }
            }, 250);
        }
    }

    function closeAbsenceOnBgClick(e) {
        if (e.target.id === 'dentAbsenceModal') {
            closeAbsenceModal();
        }
    }

    function showDayFeedback(htmlContent) {
        const fb = document.getElementById('dent-day-feedback');
        if (!fb) return;
        fb.innerHTML = `
            <div class="dent-fb-card">
                <div class="dent-fb-top" style="margin-bottom:0;">
                    <div class="dent-fb-title">${htmlContent}</div>
                    <button type="button" class="dent-fb-close-btn" onclick="hideDayFeedback()">×</button>
                </div>
            </div>
        `;
        fb.style.display = 'block';
        clearTimeout(window.dentFbTimer);
        window.dentFbTimer = setTimeout(() => {
            hideDayFeedback();
        }, 8000);
    }

    function hideDayFeedback() {
        const fb = document.getElementById('dent-day-feedback');
        if (fb) fb.style.display = 'none';
    }

    function renderDayAbsenceSuccessCard(dayName, sessionsCount, loggedItems) {
        const fb = document.getElementById('dent-day-feedback');
        if (!fb) return;

        let itemsHtml = '';
        loggedItems.forEach(item => {
            const subName = String(item.sub.name || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            const typeLabel = item.sub.isYearly ? 'سنوي' : 'فصلي';
            itemsHtml += `
                <div class="dent-fb-chip">
                    <span class="dent-fb-chip-name" title="${subName}">${subName} (${typeLabel})</span>
                    <span class="dent-fb-chip-badge">غياب: ${item.sub.absences}</span>
                </div>
            `;
        });

        fb.innerHTML = `
            <div class="dent-fb-card">
                <div class="dent-fb-top">
                    <div class="dent-fb-title">
                        <span class="dent-fb-check">✓</span>
                        <span>تم تسجيل غياب <strong>(${sessionsCount})</strong> حصص ليوم <strong>${dayName}</strong>:</span>
                    </div>
                    <div class="dent-fb-actions">
                        <button type="button" class="dent-fb-undo-btn" onclick="undoDayAbsence()" title="تراجع عن هذه العملية">تراجع ↺</button>
                        <button type="button" class="dent-fb-close-btn" onclick="hideDayFeedback()">×</button>
                    </div>
                </div>
                <div class="dent-fb-chips-grid">
                    ${itemsHtml}
                </div>
            </div>
        `;

        fb.style.display = 'block';
        clearTimeout(window.dentFbTimer);
        window.dentFbTimer = setTimeout(() => {
            hideDayFeedback();
        }, 10000);
    }

    function undoDayAbsence() {
        if (!lastLoggedDayAbsences || lastLoggedDayAbsences.length === 0) return;
        
        lastLoggedDayAbsences.forEach(item => {
            if (item.isNew) {
                const idx = dentAbsenceSubjects.indexOf(item.sub);
                if (idx !== -1) dentAbsenceSubjects.splice(idx, 1);
            } else {
                item.sub.absences = Math.max(0, (parseInt(item.sub.absences) || 0) - 1);
            }
        });

        lastLoggedDayAbsences = null;
        saveAbsenceState();
        renderAbsenceSubjects();
        showDayFeedback('<span style="color: #94a3b8;">تم التراجع عن تسجيل غياب اليوم بنجاح.</span>');
    }

    function applyDayAbsence() {
        const selectEl = document.getElementById('dent-day-skip-select');
        if (!selectEl || !selectEl.value) {
            showDayFeedback('الرجاء اختيار اليوم أولاً من القائمة.');
            return;
        }
        const selectedDay = selectEl.value.trim();
        const selectedGroup = localStorage.getItem('dent2025_selected_group') || 'المجموعة A';

        // 1. First attempt: filter timetable classes matching current student context and group
        let matchedClasses = (dentAbsenceClassSchedule || []).filter(c => {
            if (!dentAbsenceSelection) return false;
            const matchSpec = normAr(c.specialty) === normAr(dentAbsenceSelection.specialty);
            const matchYear = parseInt(c.year) === parseInt(dentAbsenceSelection.year);
            const matchSem = parseInt(c.semester) === parseInt(dentAbsenceSelection.semester);
            const matchDay = isDayEqual(c.day, selectedDay);
            const matchGroup = isGroupEqual(c.group_name, selectedGroup);
            return matchSpec && matchYear && matchSem && matchDay && matchGroup;
        });

        // 2. Fallback: if no specific group matched, look for any class on that day in this specialty/year/sem
        if (matchedClasses.length === 0) {
            matchedClasses = (dentAbsenceClassSchedule || []).filter(c => {
                if (!dentAbsenceSelection) return false;
                const matchSpec = normAr(c.specialty) === normAr(dentAbsenceSelection.specialty);
                const matchYear = parseInt(c.year) === parseInt(dentAbsenceSelection.year);
                const matchSem = parseInt(c.semester) === parseInt(dentAbsenceSelection.semester);
                const matchDay = isDayEqual(c.day, selectedDay);
                return matchSpec && matchYear && matchSem && matchDay;
            });
        }

        if (matchedClasses.length === 0) {
            showDayFeedback(`لا توجد محاضرات مسجلة في جدول يوم (${selectedDay}) لمجموعتك.`);
            return;
        }

        lastLoggedDayAbsences = [];
        matchedClasses.forEach(c => {
            const classSub = (c.subject || '').trim();
            if (!classSub) return;

            let targetSub = dentAbsenceSubjects.find(s => isSubjectMatch(classSub, s.name));

            if (!targetSub) {
                const autoYearly = dentAbsenceSelection ? isAutoYearlySubject(classSub, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : false;
                const defaults = dentAbsenceSelection ? getJazanUniversityCourseDefaults(classSub, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : null;
                targetSub = {
                    id: `auto_${Date.now()}_${Math.floor(Math.random()*1000)}`,
                    name: classSub,
                    weeklySessions: defaults ? defaults.weeklySessions : 2,
                    customTotalSessions: defaults ? defaults.totalSessions : null,
                    absences: 1,
                    isYearly: defaults ? defaults.isYearly : autoYearly,
                    isCustom: true
                };
                dentAbsenceSubjects.push(targetSub);
                lastLoggedDayAbsences.push({ sub: targetSub, isNew: true });
            } else {
                targetSub.absences = (parseInt(targetSub.absences) || 0) + 1;
                lastLoggedDayAbsences.push({ sub: targetSub, isNew: false });
            }
        });

        saveAbsenceState();
        renderAbsenceSubjects();

        if (lastLoggedDayAbsences.length > 0) {
            renderDayAbsenceSuccessCard(selectedDay, matchedClasses.length, lastLoggedDayAbsences);
        }
    }

    function toggleQuickCalcDrawer() {
        const body = document.getElementById('dent-quick-body');
        if (!body) return;
        const isShown = body.style.display === 'block';
        body.style.display = isShown ? 'none' : 'block';
        if (!isShown) calculateQuickAbsence();
    }

    function onSemesterWeeksChange(val) {
        dentAbsenceWeeks = parseInt(val) || 17;
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function getAbsenceStorageKey() {
        if (dentAbsenceSelection && dentAbsenceSelection.specialty) {
            return `dent2025_absence_${dentAbsenceSelection.specialty}_y${dentAbsenceSelection.year}_s${dentAbsenceSelection.semester}`;
        }
        return 'dent2025_absence_general';
    }

    function getYearlySyncStorageKey() {
        if (dentAbsenceSelection && dentAbsenceSelection.specialty) {
            return `dent2025_absence_${dentAbsenceSelection.specialty}_y${dentAbsenceSelection.year}_yearly_sync`;
        }
        return 'dent2025_absence_yearly_sync';
    }

    function initAbsenceEngine() {
        const rawSel = localStorage.getItem('dent2025_selection');
        if (rawSel) {
            try {
                dentAbsenceSelection = JSON.parse(rawSel);
            } catch(e) {
                dentAbsenceSelection = null;
            }
        }

        const subTitleEl = document.getElementById('dent-absence-subtitle');
        if (subTitleEl) {
            if (dentAbsenceSelection && dentAbsenceSelection.specialty) {
                const specName = dentAbsenceSelection.specialty === 'dentistry' ? 'طب الأسنان' : (dentAbsenceSelection.specialty === 'medicine' ? 'الطب البشري' : 'التحضيري');
                const yrSem = dentAbsenceSelection.specialty === 'pre-med' ? `الفصل ${dentAbsenceSelection.semester}` : `السنة ${dentAbsenceSelection.year} - الفصل ${dentAbsenceSelection.semester}`;
                subTitleEl.innerText = `${specName} (${yrSem})`;
            } else {
                subTitleEl.innerText = `مواد الفصل الحالي`;
            }
        }

        loadAbsenceData();
    }

    function loadAbsenceData() {
        const apiBase = (window.location.pathname === '/dev' || window.location.pathname.startsWith('/dev/')) ? '/dev' : '';
        
        let classPromise = Promise.resolve([]);
        if (window.currentClassesData && Array.isArray(window.currentClassesData) && window.currentClassesData.length > 0) {
            classPromise = Promise.resolve(window.currentClassesData);
        } else if (dentAbsenceSelection) {
            classPromise = fetch(`${apiBase}/dent2025_api.php?action=get_classes&specialty=${encodeURIComponent(dentAbsenceSelection.specialty)}&year=${dentAbsenceSelection.year}&semester=${dentAbsenceSelection.semester}`)
                .then(r => r.json())
                .then(res => (res.success && Array.isArray(res.data)) ? res.data : [])
                .catch(() => []);
        }

        let subjectsPromise = Promise.resolve([]);
        if (window.currentSubjectsData && Array.isArray(window.currentSubjectsData) && window.currentSubjectsData.length > 0) {
            subjectsPromise = Promise.resolve(window.currentSubjectsData);
        } else if (dentAbsenceSelection) {
            const cacheKey = `dent2025_dashboard_data_${dentAbsenceSelection.specialty}_${dentAbsenceSelection.year}_${dentAbsenceSelection.semester}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed && Array.isArray(parsed.subjects)) {
                        subjectsPromise = Promise.resolve(parsed.subjects);
                    }
                } catch(e){}
            } else {
                subjectsPromise = fetch(`${apiBase}/dent2025_api.php?action=data&specialty=${encodeURIComponent(dentAbsenceSelection.specialty)}&year=${dentAbsenceSelection.year}&semester=${dentAbsenceSelection.semester}`)
                    .then(r => r.json())
                    .then(res => (res.success && res.data && Array.isArray(res.data.subjects)) ? res.data.subjects : [])
                    .catch(() => []);
            }
        }

        Promise.all([subjectsPromise, classPromise]).then(([subjects, classes]) => {
            dentAbsenceClassSchedule = (classes && classes.length > 0) ? classes : (window.currentClassesData || []);
            buildAbsenceSubjectsList(subjects || []);
        });
    }

    function buildAbsenceSubjectsList(apiSubjects) {
        dentAbsenceSubjects = [];

        const storageKey = getAbsenceStorageKey();
        let savedState = null;
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) savedState = JSON.parse(raw);
        } catch(e){}

        // Load shared yearly sync data
        const yearlySyncKey = getYearlySyncStorageKey();
        let yearlySyncData = {};
        try {
            const rawYearly = localStorage.getItem(yearlySyncKey);
            if (rawYearly) yearlySyncData = JSON.parse(rawYearly);
        } catch(e){}

        if (savedState && savedState.weeks) {
            dentAbsenceWeeks = parseInt(savedState.weeks) || 17;
            const selEl = document.getElementById('dent-sem-weeks');
            if (selEl) selEl.value = String(dentAbsenceWeeks);
        }

        const selectedGroup = localStorage.getItem('dent2025_selected_group') || 'المجموعة A';

        const relevantClasses = (dentAbsenceClassSchedule || []).filter(c => {
            if (!dentAbsenceSelection) return false;
            const matchSpec = normAr(c.specialty) === normAr(dentAbsenceSelection.specialty);
            const matchYear = parseInt(c.year) === parseInt(dentAbsenceSelection.year);
            const matchSem = parseInt(c.semester) === parseInt(dentAbsenceSelection.semester);
            const matchGroup = isGroupEqual(c.group_name, selectedGroup);
            return matchSpec && matchYear && matchSem && matchGroup;
        });

        if (apiSubjects.length === 0 && (!savedState || !savedState.customSubjects || savedState.customSubjects.length === 0)) {
            if (!dentAbsenceSelection) {
                apiSubjects = [
                    { id: "s1", name: "تشخيص الفم (Oral Diagnosis)", hours: 2 },
                    { id: "s2", name: "علم الأمراض العام (General Pathology)", hours: 3 },
                    { id: "s3", name: "الأحياء الدقيقة (Microbiology)", hours: 3 }
                ];
            }
        }

        apiSubjects.forEach((sub, idx) => {
            let weeklySessions = 0;
            const matchedClasses = relevantClasses.filter(c => isSubjectMatch(c.subject, sub.name));

            // Check official university catalog defaults
            const defaults = dentAbsenceSelection ? getJazanUniversityCourseDefaults(sub.name, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : null;

            if (matchedClasses.length > 0) {
                weeklySessions = matchedClasses.length;
            } else if (defaults) {
                weeklySessions = defaults.weeklySessions;
            } else {
                let parsedHours = 2;
                if (typeof sub.hours === 'string') {
                    const tMatch = sub.hours.match(/(\d+)\s*نظري/);
                    const pMatch = sub.hours.match(/(\d+)\s*عملي/);
                    const th = tMatch ? parseInt(tMatch[1]) : 0;
                    const pr = pMatch ? parseInt(pMatch[1]) : 0;
                    if (th > 0 || pr > 0) parsedHours = th + pr;
                    else parsedHours = parseInt(sub.hours) || 2;
                } else {
                    parsedHours = parseInt(sub.hours) || 2;
                }
                weeklySessions = parsedHours > 0 ? parsedHours : 2;
            }

            // Detect if yearly course automatically
            let isYearly = defaults ? defaults.isYearly : (dentAbsenceSelection ? isAutoYearlySubject(sub.name, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : false);
            let customTotalSessions = defaults ? defaults.totalSessions : null;

            let savedAbsence = 0;
            if (savedState && savedState.subjects && savedState.subjects[sub.id || idx]) {
                const s = savedState.subjects[sub.id || idx];
                if (s.absences !== undefined) savedAbsence = parseInt(s.absences) || 0;
                if (s.weeklySessions !== undefined) weeklySessions = parseInt(s.weeklySessions) || weeklySessions;
                if (s.isYearly !== undefined) isYearly = s.isYearly;
                if (s.customTotalSessions !== undefined && s.customTotalSessions !== null) {
                    customTotalSessions = parseFloat(s.customTotalSessions) || customTotalSessions;
                }
            }

            // Auto-heal legacy stale saved state for official catalog courses (e.g. 311 or 351)
            if (defaults && defaults.totalSessions) {
                const isStaleLegacy = !customTotalSessions || customTotalSessions === 112 || customTotalSessions === 54 || (defaults.totalSessions === 19.34 && (customTotalSessions !== 19.34 || isYearly !== false)) || (defaults.totalSessions === 30.0 && customTotalSessions === 34);
                if (isStaleLegacy) {
                    customTotalSessions = defaults.totalSessions;
                    isYearly = defaults.isYearly;
                    if (defaults.weeklySessions) weeklySessions = defaults.weeklySessions;
                }
            }

            // Sync with yearly shared records if applicable
            const normKey = normAr(sub.name);
            if (isYearly && yearlySyncData && yearlySyncData[normKey] !== undefined) {
                savedAbsence = Math.max(savedAbsence, parseInt(yearlySyncData[normKey]) || 0);
            }

            dentAbsenceSubjects.push({
                id: sub.id || `sub_${idx}`,
                name: sub.name || `مادة ${idx + 1}`,
                weeklySessions: weeklySessions,
                customTotalSessions: customTotalSessions,
                absences: savedAbsence,
                isYearly: isYearly,
                isCustom: false
            });
        });

        if (savedState && Array.isArray(savedState.customSubjects)) {
            savedState.customSubjects.forEach(cSub => {
                const defaults = dentAbsenceSelection ? getJazanUniversityCourseDefaults(cSub.name, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : null;
                let isYearly = cSub.isYearly !== undefined ? cSub.isYearly : (defaults ? defaults.isYearly : (dentAbsenceSelection ? isAutoYearlySubject(cSub.name, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : false));
                let savedAbsence = parseInt(cSub.absences) || 0;
                let customTotalSessions = (cSub.customTotalSessions !== undefined && cSub.customTotalSessions !== null) ? parseFloat(cSub.customTotalSessions) : (defaults ? defaults.totalSessions : null);

                const normKey = normAr(cSub.name);
                if (isYearly && yearlySyncData && yearlySyncData[normKey] !== undefined) {
                    savedAbsence = Math.max(savedAbsence, parseInt(yearlySyncData[normKey]) || 0);
                }

                dentAbsenceSubjects.push({
                    id: cSub.id || `custom_${Date.now()}_${Math.random()}`,
                    name: cSub.name || 'مادة إضافية',
                    weeklySessions: parseInt(cSub.weeklySessions) || (defaults ? defaults.weeklySessions : 2),
                    customTotalSessions: customTotalSessions,
                    absences: savedAbsence,
                    isYearly: isYearly,
                    isCustom: true
                });
            });
        }

        renderAbsenceSubjects();
    }

    function renderAbsenceSubjects() {
        const container = document.getElementById('dent-absence-subjects-container');
        if (!container) return;

        if (dentAbsenceSubjects.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; color: #9ca3af; padding: 16px; font-size: 0.82rem;">
                    لا توجد مواد مسجلة لهذا الفصل حتى الآن.<br>
                    يمكنك إضافة مادة يدوياً بالضغط على زر "+ إضافة مادة" أعلاه.
                </div>
            `;
            return;
        }

        let html = '';
        dentAbsenceSubjects.forEach((sub, idx) => {
            const subjectWeeks = sub.isYearly ? (dentAbsenceWeeks * 2) : dentAbsenceWeeks;
            const totalSessions = (sub.customTotalSessions && sub.customTotalSessions > 0) ? sub.customTotalSessions : Math.max(1, (sub.weeklySessions || 1) * subjectWeeks);
            const absences = Math.max(0, sub.absences || 0);
            const percentage = ((absences / totalSessions) * 100);
            const dnThresholdCount = Math.floor(totalSessions * 0.25);

            let statusLabel = 'آمن';
            let statusClass = 'dent-status-safe';
            let progressColor = 'rgba(255, 255, 255, 0.28)';
            let remainingText = '';

            if (percentage >= 25.0) {
                statusLabel = 'حرمان (DN)';
                statusClass = 'dent-status-dn';
                progressColor = '#ef4444';
                remainingText = `تجاوزت الحد (${dnThresholdCount})`;
            } else if (percentage >= 20.0) {
                statusLabel = 'إنذار ثاني';
                statusClass = 'dent-status-warn2';
                progressColor = '#f97316';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            } else if (percentage >= 10.0) {
                statusLabel = 'إنذار أول';
                statusClass = 'dent-status-warn1';
                progressColor = '#fbbf24';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            } else {
                statusLabel = 'آمن';
                statusClass = 'dent-status-safe';
                progressColor = 'rgba(255, 255, 255, 0.28)';
                const leftForDn = Math.max(0, dnThresholdCount - absences);
                remainingText = `متبقي ${leftForDn} قبل الحرمان`;
            }

            const clampedProgress = Math.min(100, percentage);
            const safeName = String(sub.name || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));

            const deleteBtn = sub.isCustom ? `<button type="button" onclick="removeAbsenceSubject(${idx})" title="حذف المادة" style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; cursor: pointer; font-size: 0.85rem; width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;">×</button>` : '';

            const displayTotal = Number.isInteger(totalSessions) ? totalSessions : Number(totalSessions.toFixed(2));

            html += `
                <div class="dent-absence-card">
                    <div class="dent-absence-card-top">
                        ${sub.isCustom ? `
                            <input type="text" value="${safeName}" onchange="updateAbsenceSubName(${idx}, this.value)" style="width: 100%; font-size: 0.86rem; padding: 3px 8px; background: #1e1e1e; color: #f8fafc; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;" placeholder="اسم المادة">
                        ` : `
                            <h4 class="dent-absence-sub-name" title="${safeName}">${safeName}</h4>
                        `}
                        ${deleteBtn}
                    </div>

                    <div class="dent-absence-meta-row">
                        <button type="button" class="dent-absence-type-tag" onclick="toggleSubjectYearly(${idx})" title="انقر للتبديل بين مقرر سنوي ومقرر فصلي">
                            ${sub.isYearly ? 'مقرر سنوي' : 'مقرر فصلي'}
                        </button>
                        
                        <div class="dent-meta-pill">
                            <input type="number" min="1" max="15" value="${sub.weeklySessions}" onchange="updateAbsenceWeeklySessions(${idx}, this.value)" class="dent-meta-input" style="width: 20px;">
                            <span class="dent-meta-label">س/أسبوع</span>
                        </div>

                        <div class="dent-meta-pill">
                            <span class="dent-meta-label">الإجمالي:</span>
                            <input type="number" step="any" min="1" max="500" value="${displayTotal}" onchange="updateAbsenceTotalSessions(${idx}, this.value)" class="dent-meta-input" style="width: 28px;" title="إجمالي ساعات المقرر">
                        </div>

                        <div class="dent-meta-pill">
                            <span class="dent-meta-label">الحرمان:</span>
                            <span class="dent-meta-val">${dnThresholdCount}</span>
                        </div>
                    </div>

                    <div class="dent-absence-card-bottom">
                        <div class="dent-absence-stat-group">
                            <div class="dent-absence-stat-top">
                                <span class="dent-absence-stat-ratio">${absences}/${displayTotal} (${percentage.toFixed(2)}%)</span>
                                <span class="dent-status-badge ${statusClass}">${statusLabel}</span>
                            </div>
                            <div class="dent-absence-stat-rem">${remainingText}</div>
                        </div>

                        <div class="dent-absence-stepper">
                            <button type="button" class="dent-step-btn" onclick="stepAbsence(${idx}, -1)" title="إنقاص غياب">−</button>
                            <input type="number" class="dent-step-input" min="0" max="${Math.ceil(totalSessions)}" value="${absences}" onchange="setAbsenceCount(${idx}, this.value)">
                            <button type="button" class="dent-step-btn" onclick="stepAbsence(${idx}, 1)" title="زيادة غياب">+</button>
                        </div>
                    </div>

                    <div class="dent-absence-progress-bg">
                        <div class="dent-absence-progress-fill" style="width: ${clampedProgress}%; background: ${progressColor};"></div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function toggleSubjectYearly(idx) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].isYearly = !dentAbsenceSubjects[idx].isYearly;
        const defaults = dentAbsenceSelection ? getJazanUniversityCourseDefaults(dentAbsenceSubjects[idx].name, dentAbsenceSelection.specialty, dentAbsenceSelection.year) : null;
        if (defaults && defaults.totalSessions && dentAbsenceSubjects[idx].isYearly === defaults.isYearly) {
            dentAbsenceSubjects[idx].customTotalSessions = defaults.totalSessions;
            if (defaults.weeklySessions) dentAbsenceSubjects[idx].weeklySessions = defaults.weeklySessions;
        } else {
            dentAbsenceSubjects[idx].customTotalSessions = null;
        }
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function updateAbsenceTotalSessions(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        const num = parseFloat(val);
        dentAbsenceSubjects[idx].customTotalSessions = (num && num > 0) ? num : null;
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function stepAbsence(idx, delta) {
        if (!dentAbsenceSubjects[idx]) return;
        const cur = parseInt(dentAbsenceSubjects[idx].absences) || 0;
        dentAbsenceSubjects[idx].absences = Math.max(0, cur + delta);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function setAbsenceCount(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].absences = Math.max(0, parseInt(val) || 0);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function updateAbsenceWeeklySessions(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].weeklySessions = Math.max(1, parseInt(val) || 1);
        dentAbsenceSubjects[idx].customTotalSessions = null;
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function updateAbsenceSubName(idx, val) {
        if (!dentAbsenceSubjects[idx]) return;
        dentAbsenceSubjects[idx].name = val || 'مادة جديدة';
        saveAbsenceState();
    }

    function addCustomAbsenceSubject() {
        const autoYearly = dentAbsenceSelection ? isAutoYearlySubject('مادة إضافية', dentAbsenceSelection.specialty, dentAbsenceSelection.year) : false;
        dentAbsenceSubjects.push({
            id: `custom_${Date.now()}`,
            name: 'مادة إضافية',
            weeklySessions: 2,
            customTotalSessions: null,
            absences: 0,
            isYearly: autoYearly,
            isCustom: true
        });
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function removeAbsenceSubject(idx) {
        dentAbsenceSubjects.splice(idx, 1);
        saveAbsenceState();
        renderAbsenceSubjects();
    }

    function saveAbsenceState() {
        const storageKey = getAbsenceStorageKey();
        const yearlySyncKey = getYearlySyncStorageKey();

        const state = {
            weeks: dentAbsenceWeeks,
            subjects: {},
            customSubjects: []
        };

        let yearlySyncData = {};
        try {
            const rawYearly = localStorage.getItem(yearlySyncKey);
            if (rawYearly) yearlySyncData = JSON.parse(rawYearly);
        } catch(e){}

        dentAbsenceSubjects.forEach(sub => {
            if (sub.isCustom) {
                state.customSubjects.push(sub);
            } else {
                state.subjects[sub.id] = {
                    absences: sub.absences,
                    weeklySessions: sub.weeklySessions,
                    customTotalSessions: sub.customTotalSessions,
                    isYearly: sub.isYearly
                };
            }

            // Sync yearly courses
            if (sub.isYearly) {
                const normKey = normAr(sub.name);
                yearlySyncData[normKey] = sub.absences;
            }
        });

        try {
            localStorage.setItem(storageKey, JSON.stringify(state));
            localStorage.setItem(yearlySyncKey, JSON.stringify(yearlySyncData));
        } catch(e){}
    }

    function calculateQuickAbsence() {
        const weeklyInput = document.getElementById('quick-weekly-sessions');
        const weeksInput = document.getElementById('quick-weeks-count');
        const absenceInput = document.getElementById('quick-current-absence');
        const resultBox = document.getElementById('quick-calc-result');
        if (!resultBox) return;

        const weekly = Math.max(1, parseInt(weeklyInput ? weeklyInput.value : 2) || 2);
        const weeks = Math.max(1, parseInt(weeksInput ? weeksInput.value : 17) || 17);
        const absences = Math.max(0, parseInt(absenceInput ? absenceInput.value : 0) || 0);

        const total = weekly * weeks;
        const pct = ((absences / total) * 100);
        const dn = Math.floor(total * 0.25);
        const left = Math.max(0, dn - absences);

        resultBox.innerHTML = `
            الإجمالي: <strong>${total}</strong> حصة (${weekly} أسبوعياً × ${weeks} أسبوع) • حد الحرمان: <strong>${dn}</strong><br>
            نسبة الغياب: <strong>${pct.toFixed(2)}%</strong> • متبقي: <strong>${left}</strong> غيابات قبل الحرمان
        `;
    }
</script>
