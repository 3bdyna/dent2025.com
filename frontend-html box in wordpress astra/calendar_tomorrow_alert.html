<style>
    /* Dent2025 compact next-day academic event alert */
    .dent-tomorrow-calendar-alert {
        display: grid;
        grid-template-columns: 76px 1px minmax(0, 1fr) auto;
        grid-template-areas: "date divider content action";
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 12px 0 2px;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
        color: #f1f1f3;
        direction: rtl;
        font-family: 'Noto Kufi Arabic', 'Outfit', sans-serif;
    }

    .dent-tomorrow-calendar-alert[hidden],
    .dent-tomorrow-calendar-meta[hidden] {
        display: none !important;
    }

    /* Plain date block with no surrounding box. */
    .dent-tomorrow-calendar-date {
        grid-area: date;
        width: 76px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .dent-tomorrow-calendar-divider {
        grid-area: divider;
        align-self: stretch;
        width: 1px;
        margin: 5px 0;
        background: rgba(255, 255, 255, 0.13);
    }

    .dent-tomorrow-calendar-date-day {
        color: #eeeeef;
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
        font-size: 0.98rem;
        font-weight: 700;
        line-height: 1.1;
    }

    .dent-tomorrow-calendar-date-month {
        color: #9b9ba3;
        font-size: 0.60rem;
        line-height: 1.3;
        white-space: nowrap;
    }

    .dent-tomorrow-calendar-content {
        grid-area: content;
        min-width: 0;
    }

    .dent-tomorrow-calendar-label {
        display: block;
        margin: 0 0 1px;
        color: #8f8f96;
        font-size: 0.72rem;
        line-height: 1.5;
    }

    .dent-tomorrow-calendar-title {
        margin: 0;
        overflow: hidden;
        color: #eeeeef;
        font-size: 0.96rem;
        font-weight: 700;
        line-height: 1.6;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .dent-tomorrow-calendar-meta {
        margin: 1px 0 0;
        overflow: hidden;
        color: #85858d;
        font-size: 0.72rem;
        line-height: 1.5;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .dent-tomorrow-calendar-action {
        grid-area: action;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.04);
        color: #bdbdc3;
        font-size: 0.70rem;
        line-height: 1.5;
        text-decoration: none;
        white-space: nowrap;
    }

    .dent-tomorrow-calendar-action:hover,
    .dent-tomorrow-calendar-action:focus-visible {
        background: rgba(255, 255, 255, 0.09);
        color: #ffffff;
        outline: none;
    }

    .dent-tomorrow-calendar-action:focus-visible {
        outline: 1px solid rgba(255, 255, 255, 0.35);
        outline-offset: 2px;
    }

    @media (max-width: 650px) {
        .dent-tomorrow-calendar-alert {
            grid-template-columns: 64px 1px minmax(0, 1fr) auto;
            grid-template-areas: "date divider content action";
            gap: 8px;
            padding: 10px 11px;
        }

        .dent-tomorrow-calendar-date {
            width: 64px;
        }

        .dent-tomorrow-calendar-divider {
            margin: 4px 0;
        }

        .dent-tomorrow-calendar-label {
            font-size: 0.64rem;
        }

        .dent-tomorrow-calendar-title {
            font-size: 0.86rem;
            white-space: normal;
        }

        .dent-tomorrow-calendar-meta {
            font-size: 0.66rem;
        }

        .dent-tomorrow-calendar-action {
            padding: 6px 7px;
            font-size: 0.64rem;
        }
    }
</style>

<section
    id="dent-tomorrow-calendar-alert"
    class="dent-tomorrow-calendar-alert"
    role="status"
    aria-live="polite"
    hidden
>
    <div id="dent-tomorrow-calendar-date" class="dent-tomorrow-calendar-date" aria-label="تاريخ الحدث">
        <strong id="dent-tomorrow-calendar-date-day" class="dent-tomorrow-calendar-date-day"></strong>
        <span id="dent-tomorrow-calendar-date-month" class="dent-tomorrow-calendar-date-month"></span>
    </div>

    <span class="dent-tomorrow-calendar-divider" aria-hidden="true"></span>

    <div class="dent-tomorrow-calendar-content">
        <span id="dent-tomorrow-calendar-label" class="dent-tomorrow-calendar-label"></span>
        <h2 id="dent-tomorrow-calendar-title" class="dent-tomorrow-calendar-title"></h2>
        <p id="dent-tomorrow-calendar-meta" class="dent-tomorrow-calendar-meta"></p>
    </div>

    <a class="dent-tomorrow-calendar-action" href="/التقويم-الأكاديمي/">
        عرض التقويم
    </a>
</section>

<script>
(function () {
    'use strict';

    if (window.dentTomorrowCalendarAlertLoaded) return;
    window.dentTomorrowCalendarAlertLoaded = true;

    var alertId = 'dent-tomorrow-calendar-alert';
    var scheduleEndpoint = window.location.origin + '/schedule_backend.php';
    var selectionKey = 'dent2025_selection';

    function getElement(id) {
        return document.getElementById(id);
    }

    function hideAlert() {
        var alert = getElement(alertId);
        if (alert) alert.hidden = true;
    }

    function readSelection() {
        try {
            var raw = localStorage.getItem(selectionKey);
            var selection = raw ? JSON.parse(raw) : null;

            if (!selection || !selection.specialty || !selection.year || !selection.semester) {
                return null;
            }

            return selection;
        } catch (error) {
            return null;
        }
    }

    function parseLocalDate(dateString) {
        if (!dateString || typeof dateString !== 'string') return null;

        var match = dateString.slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;

        var date = new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

        date.setHours(0, 0, 0, 0);
        return isNaN(date.getTime()) ? null : date;
    }

    function getTomorrow() {
        var tomorrow = new Date();
        tomorrow.setHours(0, 0, 0, 0);
        tomorrow.setDate(tomorrow.getDate() + 1);
        return tomorrow;
    }

    function isEventTomorrow(event, tomorrow) {
        var startDate = parseLocalDate(event.date);
        if (!startDate) return false;

        var endDate = parseLocalDate(event.end_date || event.date) || startDate;
        return tomorrow >= startDate && tomorrow <= endDate;
    }

    function formatTomorrowDate(date) {
        try {
            var day = new Intl.DateTimeFormat('ar-SA', {
                day: 'numeric'
            }).format(date);
            var month = new Intl.DateTimeFormat('ar-SA', {
                month: 'short'
            }).format(date);
            return { day: day, month: month };
        } catch (error) {
            return { day: '', month: '' };
        }
    }

    function eventsCountLabel(count) {
        if (count === 1) return 'حدث غداً في التقويم الدراسي';
        if (count === 2) return 'لديك حدثان غداً';
        if (count >= 3 && count <= 10) return 'لديك ' + count + ' أحداث غداً';
        return 'لديك ' + count + ' حدثاً غداً';
    }

    function render(events, tomorrow) {
        var alert = getElement(alertId);
        if (!alert || !Array.isArray(events) || events.length === 0) {
            hideAlert();
            return;
        }

        var firstEvent = events[0] || {};
        var title = String(firstEvent.title || 'حدث دراسي');
        var meta = events.length > 1
            ? 'يوجد أكثر من حدث في هذا اليوم'
            : '';

        getElement('dent-tomorrow-calendar-label').textContent = eventsCountLabel(events.length);
        getElement('dent-tomorrow-calendar-title').textContent = title;
        getElement('dent-tomorrow-calendar-meta').textContent = meta;
        getElement('dent-tomorrow-calendar-meta').hidden = !meta;
        var dateParts = formatTomorrowDate(tomorrow);
        getElement('dent-tomorrow-calendar-date-day').textContent = dateParts.day;
        getElement('dent-tomorrow-calendar-date-month').textContent = dateParts.month;

        alert.hidden = false;
    }

    function loadTomorrowEvent() {
        var selection = readSelection();
        if (!selection) {
            hideAlert();
            return;
        }

        var scheduleId = selection.specialty + '_y' + selection.year + '_s' + selection.semester;
        var url = scheduleEndpoint
            + '?schedule_id=' + encodeURIComponent(scheduleId)
            + '&_t=' + Date.now();

        var tomorrow = getTomorrow();

        fetch(url, {
            method: 'GET',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        })
            .then(function (response) {
                if (!response.ok) throw new Error('Calendar request failed');
                return response.json();
            })
            .then(function (result) {
                var events = result && result.success && Array.isArray(result.data)
                    ? result.data
                    : [];

                events = events
                    .filter(function (event) {
                        return event && isEventTomorrow(event, tomorrow);
                    })
                    .sort(function (a, b) {
                        return String(a.date || '').localeCompare(String(b.date || ''));
                    });

                render(events, tomorrow);
            })
            .catch(function () {
                hideAlert();
            });
    }

    function init() {
        loadTomorrowEvent();

        window.addEventListener('storage', function (event) {
            if (event.key === selectionKey) loadTomorrowEvent();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
