<style>
    /* Container with 0 height so it takes NO space on the page */
    .dent-schedule-controls-wrapper {
        position: relative;
        height: 0;
        width: 100%;
        display: block;
        z-index: 999999;
    }

    /* The tiny invisible lock */
    .dent-schedule-secret-lock {
        position: absolute;
        top: -15px; /* Above the schedule */
        right: -15px; /* Top right corner */
        cursor: pointer; 
        opacity: 0.15; /* Almost invisible */
        transition: all 0.3s ease; 
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        border-radius: 50%;
    }
    .dent-schedule-secret-lock:hover { 
        opacity: 0.8; 
        transform: scale(1.1); 
    }
</style>

<div class="dent-schedule-controls-wrapper">
    <div class="dent-schedule-secret-lock" onclick="promptScheduleAdminLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>
</div>

<script>
    function promptScheduleAdminLogin() {
        if (sessionStorage.getItem('dent2025_schedule_admin_pass')) {
            activateScheduleAdminMode();
            return;
        }

        const pass = prompt("Enter Schedule Admin Password:");
        if (!pass) return;

        // Verify password against the shared RBAC engine via check_auth
        const apiBase = window.location.pathname.startsWith('/dev') ? '/dev' : '';
        let sel = {};
        try { sel = JSON.parse(localStorage.getItem('dent2025_selection') || '{}'); } catch(e) {}
        fetch(apiBase + '/dent2025_api.php?action=check_auth', {
            method: 'POST',
            body: JSON.stringify({ password: pass, specialty: sel.specialty, year: sel.year, semester: sel.semester })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                sessionStorage.setItem('dent2025_schedule_admin_pass', pass);
                const perms = (res.data && res.data.permissions) ? res.data.permissions : {};
                sessionStorage.setItem('dent2025_permissions', JSON.stringify(perms));
                activateScheduleAdminMode();
            } else {
                alert("كلمة المرور غير صحيحة. (Incorrect Password)");
            }
        }).catch(err => {
            console.error(err);
            alert("Network error while logging in.");
        });
    }

    function activateScheduleAdminMode() {
        let lock = document.querySelector('.dent-schedule-secret-lock');
        if(lock) { lock.style.display = 'none'; }
        
        if (typeof ScheduleApp !== 'undefined') {
            if (typeof ScheduleApp.enableAdminMode === 'function') {
                ScheduleApp.enableAdminMode(sessionStorage.getItem('dent2025_schedule_admin_pass'));
            }
        }
    }
    
    // Auto-check on load in case they refreshed
    document.addEventListener("DOMContentLoaded", () => {
        if (sessionStorage.getItem('dent2025_schedule_admin_pass')) {
            // Wait a split second for ScheduleApp to init
            setTimeout(() => {
                activateScheduleAdminMode();
            }, 500);
        }
    });
</script>
