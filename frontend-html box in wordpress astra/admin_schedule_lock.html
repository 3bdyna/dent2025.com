<style>
    /* Container with 0 height so it takes NO space on the page */
    .dent-schedule-controls-wrapper {
        position: relative;
        height: 0;
        width: 100%;
        display: block;
        z-index: 999999;
    }

    /* The tiny invisible lock */
    .dent-schedule-secret-lock {
        position: absolute;
        top: -15px; /* Above the schedule */
        right: -15px; /* Top right corner */
        cursor: pointer; 
        opacity: 0.15; /* Almost invisible */
        transition: all 0.3s ease; 
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        border-radius: 50%;
    }
    .dent-schedule-secret-lock:hover { 
        opacity: 0.8; 
        transform: scale(1.1); 
    }
</style>

<div class="dent-schedule-controls-wrapper">
    <div class="dent-schedule-secret-lock" onclick="promptScheduleAdminLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>
</div>

<script src="/frontend_components/dent_pin_modal.js"></script>
<script>
    function promptScheduleAdminLogin() {
        const existingPass = sessionStorage.getItem('dent2025_schedule_admin_pass') || sessionStorage.getItem('dent2025_admin_pass');
        if (existingPass) {
            activateScheduleAdminMode();
            return;
        }

        let sel = {};
        try { sel = JSON.parse(localStorage.getItem('dent2025_selection') || '{}'); } catch(e) {}

        if (window.dentPromptPin) {
            window.dentPromptPin({
                title: 'تسجيل دخول المشرف',
                subtitle: 'أدخل رمز PIN لإدارة أحداث التقويم الأكاديمي',
                context: sel,
                onSuccess: function() {
                    activateScheduleAdminMode();
                }
            });
            return;
        }

        const pass = prompt("أدخل رمز PIN للمشرف:");
        if (!pass) return;

        const apiBase = window.location.pathname.startsWith('/dev') ? '/dev' : '';
        fetch(apiBase + '/dent2025_api.php?action=check_auth', {
            method: 'POST',
            body: JSON.stringify({ password: pass, specialty: sel.specialty, year: sel.year, semester: sel.semester })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                sessionStorage.setItem('dent2025_admin_pass', pass);
                sessionStorage.setItem('dent2025_schedule_admin_pass', pass);
                const perms = (res.data && res.data.permissions) ? res.data.permissions : {};
                sessionStorage.setItem('dent2025_permissions', JSON.stringify(perms));
                activateScheduleAdminMode();
            } else {
                alert(res.message || "رمز PIN غير صحيح.");
            }
        }).catch(err => {
            console.error(err);
            alert("حدث خطأ في الاتصال بالخادم أثناء تسجيل الدخول.");
        });
    }

    function activateScheduleAdminMode() {
        let lock = document.querySelector('.dent-schedule-secret-lock');
        if(lock) { lock.style.display = 'none'; }
        
        const activePass = sessionStorage.getItem('dent2025_schedule_admin_pass') || sessionStorage.getItem('dent2025_admin_pass');
        if (typeof ScheduleApp !== 'undefined' && typeof ScheduleApp.enableAdminMode === 'function') {
            ScheduleApp.enableAdminMode(activePass);
        }
    }
    
    // Auto-check on load in case they refreshed
    document.addEventListener("DOMContentLoaded", () => {
        const savedPass = sessionStorage.getItem('dent2025_schedule_admin_pass') || sessionStorage.getItem('dent2025_admin_pass');
        if (savedPass) {
            setTimeout(() => {
                activateScheduleAdminMode();
            }, 500);
        }
    });
</script>
