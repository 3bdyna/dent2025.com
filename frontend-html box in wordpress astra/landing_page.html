<!-- landing_page.html -->
<style>
    /* Fonts (Outfit + Noto Kufi Arabic) are self-hosted and loaded globally via /frontend_components/fonts/fonts.css */
    
    .dent-landing-wrapper * { box-sizing: border-box; }
    
    .dent-landing-wrapper {
        min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif; direction: rtl; background: transparent; color: #fff;
        padding: 20px;
    }

    .dent-landing-card {
        background: #1e1e1e;
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 3rem;
        width: 100%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        backdrop-filter: blur(20px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden; text-align: center;
    }

    .dent-landing-title {
        font-size: 2.4rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #fff, #9ca3af);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .dent-landing-subtitle { color: #9ca3af; font-size: 1.1rem; margin-bottom: 2.5rem; }

    .dent-step-container { display: none; animation: slideIn 0.4s ease forwards; width: 100%; }
    .dent-step-container.active { display: block; }

    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

    .dent-grid { display: grid; gap: 12px; width: 100%; }
    .dent-grid-2 { grid-template-columns: 1fr 1fr; }

    .dent-btn-choice {
        background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #e2e8f0;
        padding: 20px; border-radius: 14px; font-size: 1.2rem; font-weight: 600; font-family: inherit;
        cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
    }
    
    .dent-btn-choice span.en { font-size: 0.9rem; color: #9ca3af; font-weight: 400; }
    .dent-btn-choice:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .dent-btn-choice:active { transform: translateY(0); }

    .dent-btn-back {
        background: transparent; border: none; color: #9ca3af; font-size: 1rem; cursor: pointer;
        margin-top: 2rem; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.2s; width: 100%;
    }
    .dent-btn-back:hover { color: #f8fafc; }

    /* Mobile Adaptations */
    @media (max-width: 600px) {
        .dent-landing-card { padding: 1.5rem; border-radius: 16px; }
        .dent-landing-title { font-size: 1.8rem; }
        .dent-landing-subtitle { font-size: 0.95rem; margin-bottom: 1.5rem; }
        .dent-btn-choice { padding: 15px; font-size: 1.1rem; }
        .dent-grid-2 { grid-template-columns: 1fr; } /* Stack years on top of each other on very small screens */
    }
</style>

<div class="dent-landing-wrapper">
    <div class="dent-landing-card">
        <h1 class="dent-landing-title">مرحباً بك في Dent2025</h1>
        <p class="dent-landing-subtitle" id="step-subtitle">اختر مسارك للوصول إلى المواد والجداول</p>

        <!-- STEP 1: Specialty -->
        <div class="dent-step-container active" id="step-1">
            <div class="dent-grid">
                <button class="dent-btn-choice" onclick="selectSpecialty('dentistry')">طب الأسنان <span class="en">Dentistry</span></button>
                <button class="dent-btn-choice" onclick="selectSpecialty('medicine')">الطب البشري <span class="en">Medicine</span></button>
                <button class="dent-btn-choice" onclick="selectSpecialty('pre-med')">السنة التحضيرية <span class="en">Pre-Med</span></button>
            </div>
        </div>

        <!-- STEP 2: Year -->
        <div class="dent-step-container" id="step-2">
            <div class="dent-grid dent-grid-2" id="year-grid">
                <!-- Generated by JS -->
            </div>
            <button class="dent-btn-back" onclick="goBack(1)">← الرجوع خطوة</button>
        </div>

        <!-- STEP 3: Semester -->
        <div class="dent-step-container" id="step-3">
            <div class="dent-grid">
                <button class="dent-btn-choice" onclick="selectSemester(1)">الفصل الأول <span class="en">First Semester</span></button>
                <button class="dent-btn-choice" onclick="selectSemester(2)">الفصل الثاني <span class="en">Second Semester</span></button>
            </div>
            <button class="dent-btn-back" onclick="goBack(2)">← الرجوع خطوة</button>
        </div>

    </div>
</div>

<script>
    let userSelection = { specialty: '', year: '', semester: '' };

    function selectSpecialty(spec) {
        userSelection.specialty = spec;
        
        if (spec === 'pre-med') {
            userSelection.year = 0; // Pre-med doesn't have years, skip straight to semester
            showStep(3, "اختر الفصل الدراسي");
        } else {
            generateYearButtons(spec, 6);
            showStep(2, "اختر السنة الدراسية");
        }
    }

    function generateYearButtons(spec, max) {
        const grid = document.getElementById('year-grid');
        grid.innerHTML = '';
        
        let startYear = (spec === 'dentistry' || spec === 'medicine') ? 2 : 1;
        
        for(let i = startYear; i <= max; i++) {
            grid.innerHTML += `<button class="dent-btn-choice" onclick="selectYear(${i})">السنة ${i} <span class="en">Year ${i}</span></button>`;
        }
    }

    function selectYear(y) {
        userSelection.year = y;
        showStep(3, "اختر الفصل الدراسي");
    }

    function selectSemester(s) {
        userSelection.semester = s;
        localStorage.setItem('dent2025_selection', JSON.stringify(userSelection));
        
        // Get the page the user originally wanted to visit (saved by dashboard.js before redirecting here)
        let redirectUrl = sessionStorage.getItem('dent2025_redirect_after') || '/';
        sessionStorage.removeItem('dent2025_redirect_after');
        if (redirectUrl.includes('wolcome') || redirectUrl.includes('welcome')) {
            redirectUrl = '/';
        }
        
        // Add a smooth fade out before redirecting
        document.querySelector('.dent-landing-card').style.opacity = '0';
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 300);
    }

    function showStep(stepNum, subtitle) {
        document.querySelectorAll('.dent-step-container').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');
        document.getElementById('step-subtitle').innerText = subtitle;
    }

    function goBack(stepNum) {
        if (stepNum === 2 && userSelection.specialty === 'pre-med') {
            stepNum = 1;
        }
        let title = "اختر مسارك للوصول إلى المواد والجداول";
        if (stepNum === 2) title = "اختر السنة الدراسية";
        showStep(stepNum, title);
    }
</script>
