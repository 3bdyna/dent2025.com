<style>
/* Scoped styles for the custom chapters block */
.dent-chapters-wrapper {
    display: flex; flex-direction: column; gap: 15px; font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
    margin: 20px 0; direction: rtl;
}
.dent-chapter-details {
    background: #18191d;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
    border-radius: 18px;
    mask-image: none;
    -webkit-mask-image: none;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.65), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
}
.dent-chapter-details:hover {
    background: #1f2025;
    border: none;
    box-shadow: 0 25px 45px -8px rgba(0, 0, 0, 0.75), 0 10px 15px -5px rgba(0, 0, 0, 0.55);
    transform: translateY(-2px);
}
.dent-chapter-details[open] {
    border: none;
    box-shadow: 0 25px 45px -8px rgba(0, 0, 0, 0.75), 0 10px 15px -5px rgba(0, 0, 0, 0.55);
}
.dent-chapter-summary {
    padding: 16px 20px; font-size: 1.05rem; font-weight: 600; color: var(--dent-text-primary, #f8fafc); cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; align-items: center;
    background: transparent; transition: background 0.3s ease;
}
.dent-chapter-summary::-webkit-details-marker { display: none; }
.dent-chapter-summary:hover { background: var(--dent-bg-card-hover, rgba(255, 255, 255, 0.03)); }
.dent-chapter-summary::after { content: '+'; font-size: 1.5rem; font-weight: 400; color: var(--dent-text-secondary, #9ca3af); transition: transform 0.3s ease; }
.dent-chapter-details[open] .dent-chapter-summary::after { content: '−'; transform: rotate(180deg); color: var(--dent-text-primary, #f8fafc); }

.dent-chapter-info-box {
    display: flex; flex-direction: column; gap: 8px; background: var(--dent-bg-card-subtle, rgba(0, 0, 0, 0.2));
    padding: 12px 18px; border-top: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05)); font-size: 0.85rem;
    line-height: 1.6;
}
.dent-info-item { display: block; line-height: 1.6; }
.dent-info-label { color: var(--dent-text-secondary, #9ca3af); font-weight: 600; margin-inline-end: 6px; display: inline; }
.dent-info-value { color: var(--dent-text-primary, #f8fafc); font-weight: 400; display: inline; word-break: normal; }

.dent-chapter-iframe-container { 
    padding: 0; 
    border-top: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05)); 
    background: #000000; 
    position: relative;
}
.dent-chapter-iframe-container iframe { 
    width: 100%; 
    height: 380px; 
    border: 0; 
    background: #ffffff; 
    filter: invert(0.92) hue-rotate(180deg) brightness(1.05) contrast(0.95); 
    display: block; 
    transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.dent-chapter-iframe-container.is-expanded iframe {
    height: 650px;
}

@media (max-width: 768px) {
    .dent-chapter-iframe-container iframe { height: 310px; }
    .dent-chapter-iframe-container.is-expanded iframe { height: 520px; }
}

/* Tab Switcher & Content Panels (Scoped to Subject Cards) */
.dent-chapter-details .dent-tab-switcher {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    background: var(--dent-bg-input-subtle, rgba(0, 0, 0, 0.3));
    border-top: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05));
    border-bottom: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05));
    padding: 6px;
    gap: 6px;
}
.dent-chapter-details .dent-tab-btn {
    flex: 1 1 50%;
    width: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--dent-text-secondary, #a1a1aa);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    text-align: center;
    white-space: nowrap;
    box-sizing: border-box;
}
.dent-chapter-details .dent-tab-btn:hover {
    color: var(--dent-text-primary, #f8fafc);
    background: var(--dent-bg-card-hover, rgba(255, 255, 255, 0.04));
}
.dent-chapter-details .dent-tab-btn.active {
    color: var(--dent-text-light, #ffffff);
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.08));
    border-color: var(--dent-border-subtle, rgba(255, 255, 255, 0.12));
}
.dent-chapter-details .dent-tab-panel {
    display: none;
}
.dent-chapter-details .dent-tab-panel.active {
    display: block;
}
.dent-chapter-details .dent-tab-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--dent-bg-card-subtle, rgba(0, 0, 0, 0.2));
    border-top: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05));
    gap: 8px;
    flex-wrap: wrap;
}
.dent-chapter-details .dent-drive-action-btn {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--dent-text-primary, #f8fafc);
    text-decoration: none;
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.06));
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.12));
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    box-sizing: border-box;
}
.dent-drive-action-btn:hover {
    background: var(--dent-bg-pill-hover, rgba(255, 255, 255, 0.14));
    border-color: var(--dent-border-hover, rgba(255, 255, 255, 0.25));
    color: var(--dent-text-light, #ffffff);
}
.dent-expand-toggle-btn {
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.06));
    border-color: var(--dent-border-card, rgba(255, 255, 255, 0.14));
    color: var(--dent-text-primary, #f4f4f5);
}
.dent-expand-toggle-btn:hover {
    background: var(--dent-bg-pill-hover, rgba(255, 255, 255, 0.14));
    border-color: var(--dent-border-hover, rgba(255, 255, 255, 0.25));
    color: #ffffff;
}
.dent-add-link-btn {
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.05));
    border: 1px solid var(--dent-border-card, rgba(255, 255, 255, 0.1));
    color: var(--dent-text-secondary, #d4d4d8);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    transition: all 0.2s ease;
}
.dent-add-link-btn:hover {
    background: var(--dent-bg-pill-hover, rgba(255, 255, 255, 0.12));
    color: var(--dent-text-light, #ffffff);
}

/* Section Header & Footer */
.dent-section-header {
    text-align: center; direction: rtl; margin-bottom: 20px; padding: 0 10px;
    font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
}
.dent-section-title {
    font-size: 1.5rem; font-weight: 700; margin: 0 0 6px 0;
    color: var(--dent-text-primary, #f8fafc) !important;
    background: none !important;
    -webkit-background-clip: initial !important;
    -webkit-text-fill-color: var(--dent-text-primary, #f8fafc) !important;
}
.dent-section-subtitle {
    font-size: 0.85rem; color: var(--dent-text-secondary, #94a3b8); margin: 0; font-weight: 500;
}
.dent-section-footer {
    text-align: center; direction: rtl; padding: 15px 10px; margin-top: 15px;
    font-size: 0.85rem; color: var(--dent-text-dim, #4a5568); font-family: 'Outfit', 'Noto Kufi Arabic', sans-serif;
    border-top: 1px dashed var(--dent-border-subtle, rgba(255,255,255,0.05));
}

@media (max-width: 600px) {
    .dent-chapter-summary {
        padding: 12px 14px;
        font-size: 0.92rem;
    }
    .dent-chapter-summary a {
        font-size: 0.75rem !important;
        padding: 3px 8px !important;
    }
    .dent-tab-btn {
        font-size: 0.76rem !important;
        padding: 8px 4px !important;
    }
    .dent-tab-footer {
        flex-direction: row !important;
        gap: 6px !important;
        padding: 8px 10px !important;
    }
    .dent-tab-footer .dent-drive-action-btn {
        flex: 1 1 45% !important;
        justify-content: center !important;
        font-size: 0.74rem !important;
        padding: 7px 6px !important;
    }
}

/* =========================================================================
   NATIVE 1-CLICK FILES LIST UI (DENT2025 DARK THEME)
   ========================================================================= */
.dent-native-files-container {
    padding: 12px 14px;
    background: #000000;
    border-top: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05));
    min-height: 100px;
    box-sizing: border-box;
    direction: rtl;
}

/* Summary Quick Drive Button */
.dent-summary-drive-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--dent-text-secondary, #94a3b8);
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.05));
    border: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.1));
    border-radius: 6px;
    padding: 4px 8px;
    margin-inline-end: 10px;
    text-decoration: none;
    transition: all 0.2s ease;
    white-space: nowrap;
}
.dent-summary-drive-btn:hover {
    color: #ffffff;
    background: var(--dent-bg-pill-hover, rgba(255, 255, 255, 0.12));
    border-color: var(--dent-border-hover, rgba(255, 255, 255, 0.25));
}

/* Toolbar: Search input + Stats & Refresh */
.dent-files-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}
.dent-files-search-wrap {
    flex: 1;
    min-width: 180px;
    position: relative;
}
.dent-files-search-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--dent-bg-input-subtle, rgba(255, 255, 255, 0.04));
    border: 1px solid var(--dent-border-card, rgba(255, 255, 255, 0.1));
    border-radius: 8px;
    padding: 8px 12px 8px 34px;
    color: var(--dent-text-primary, #f8fafc);
    font-size: 0.82rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
}
.dent-files-search-input:focus {
    border-color: rgba(56, 189, 248, 0.5);
    background: rgba(255, 255, 255, 0.07);
}
.dent-files-search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--dent-text-dim, #64748b);
    pointer-events: none;
    font-size: 0.85rem;
}
.dent-files-meta-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}
.dent-files-badge {
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--dent-text-secondary, #94a3b8);
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.06));
    border: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.08));
    padding: 5px 9px;
    border-radius: 6px;
    white-space: nowrap;
}
.dent-files-refresh-btn {
    background: var(--dent-bg-pill, rgba(255, 255, 255, 0.05));
    border: 1px solid var(--dent-border-card, rgba(255, 255, 255, 0.1));
    color: var(--dent-text-secondary, #cbd5e1);
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.76rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s ease;
    font-family: inherit;
}
.dent-files-refresh-btn:hover {
    background: var(--dent-bg-pill-hover, rgba(255, 255, 255, 0.12));
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.25);
}

/* Files List Items */
.dent-files-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-height: 520px;
    overflow-y: auto;
    padding-inline-end: 4px;
}
.dent-files-list::-webkit-scrollbar {
    width: 6px;
}
.dent-files-list::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
}
.dent-files-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
}

.dent-file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--dent-border-subtle, rgba(255, 255, 255, 0.05));
    border-radius: 10px;
    padding: 10px 14px;
    gap: 12px;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.dent-file-item:hover {
    background: rgba(255, 255, 255, 0.055);
    border-color: var(--dent-border-hover, rgba(255, 255, 255, 0.15));
    transform: translateX(-2px);
}
.dent-file-main {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
}
.dent-file-icon-badge {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    box-sizing: border-box;
}
.dent-file-icon-badge.badge-pdf { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }
.dent-file-icon-badge.badge-ppt { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
.dent-file-icon-badge.badge-doc { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
.dent-file-icon-badge.badge-video { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25); }
.dent-file-icon-badge.badge-generic { background: rgba(255, 255, 255, 0.06); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); }

.dent-file-title {
    color: var(--dent-text-primary, #f8fafc);
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.4;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.dent-file-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}
.dent-file-btn {
    text-decoration: none;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
    box-sizing: border-box;
}
.dent-file-btn-view {
    background: rgba(56, 189, 248, 0.12);
    color: #38bdf8;
    border-color: rgba(56, 189, 248, 0.25);
}
.dent-file-btn-view:hover {
    background: rgba(56, 189, 248, 0.24);
    border-color: rgba(56, 189, 248, 0.5);
    color: #ffffff;
}
.dent-file-btn-download {
    background: rgba(16, 185, 129, 0.12);
    color: #34d399;
    border-color: rgba(16, 185, 129, 0.25);
}
.dent-file-btn-download:hover {
    background: rgba(16, 185, 129, 0.24);
    border-color: rgba(16, 185, 129, 0.5);
    color: #ffffff;
}

/* Skeleton Loading Shimmer */
.dent-file-skeleton {
    height: 48px;
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 75%);
    background-size: 200% 100%;
    animation: dentShimmer 1.5s infinite;
}
@keyframes dentShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@media (max-width: 600px) {
    .dent-files-toolbar {
        flex-direction: column;
        align-items: stretch;
    }
    .dent-files-meta-actions {
        justify-content: space-between;
    }
    .dent-file-item {
        padding: 9px 10px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
    .dent-file-main {
        width: 100%;
    }
    .dent-file-title {
        font-size: 0.82rem;
    }
    .dent-file-actions {
        width: 100%;
        justify-content: flex-end;
    }
    .dent-file-btn {
        padding: 8px 12px;
        font-size: 0.76rem;
        flex: 1;
        justify-content: center;
        min-height: 38px;
    }
}
</style>

<!-- Inline Poll Slot (Loads seamlessly above course chapters) -->
<div id="dent-poll-widget-slot"></div>
<script>
  (function() {
    fetch('/frontend_components/poll_widget.html')
      .then(function(r) { return r.ok ? r.text() : ''; })
      .then(function(html) {
        if (!html) return;
        var slot = document.getElementById('dent-poll-widget-slot');
        if (slot) {
          var range = document.createRange();
          var frag = range.createContextualFragment(html);
          slot.appendChild(frag);
        }
      }).catch(function() {});
  })();
</script>

<!-- This container will be populated by dashboard.js -->
<div id="dynamic-chapters-container" style="opacity:0; transition: opacity 0.3s ease;"></div>

<!-- Automatically load dashboard.js for chapters rendering -->
<script src="/frontend_components/dashboard.js"></script>
