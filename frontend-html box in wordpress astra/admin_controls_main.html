<style>
    /* Container to hold the controls without taking up ANY vertical space on the page */
    .dent-admin-controls-wrapper {
        position: relative;
        height: 0;
        width: 100%;
        overflow: visible;
        z-index: 999999;
    }

    /* The tiny invisible lock for the Main Page */
    .dent-secret-lock-main {
        position: absolute;
        bottom: 20px; /* Hovers just above the chat box */
        right: 15px;
        cursor: pointer; 
        opacity: 0.1; transition: opacity 0.3s; font-size: 1.2rem; filter: grayscale(100%);
    }
    .dent-secret-lock-main:hover { opacity: 0.8; filter: none; }

    /* The tiny logout button for the Main Page */
    .dent-logout-main {
        position: absolute;
        bottom: 20px;
        right: 15px;
        background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;
        padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-family: 'Outfit', sans-serif;
        display: none; /* Hidden by default */
        backdrop-filter: blur(10px);
    }
    .dent-logout-main:hover { background: rgba(239, 68, 68, 0.3); }
</style>

<div class="dent-admin-controls-wrapper">
    <div class="dent-secret-lock-main" id="dent-lock-main" onclick="promptAdminLoginMain()" title="Admin Login">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>
    <button class="dent-logout-main" id="dent-logout-main" onclick="logoutAdminMain()">خروج (Logout)</button>
</div>

<script src="/frontend_components/dent_pin_modal.js"></script>
<script>
    function promptAdminLoginMain() {
        if (sessionStorage.getItem('dent2025_admin_pass')) {
            activateAdminModeMain();
            return;
        }

        const sel = JSON.parse(localStorage.getItem('dent2025_selection') || '{}');
        if (window.dentPromptPin) {
            window.dentPromptPin({
                title: 'تسجيل دخول المشرف',
                subtitle: 'أدخل رمز PIN لإدارة الإعلانات والمحتوى',
                context: sel,
                onSuccess: function() {
                    activateAdminModeMain();
                }
            });
            return;
        }

        // Fallback if modal script is still loading
        const pass = prompt("أدخل رمز PIN للمشرف:");
        if (!pass) return;

        const apiBase = '';
        fetch(apiBase + '/dent2025_api.php?action=check_auth', {
            method: 'POST',
            body: JSON.stringify({ password: pass, specialty: sel.specialty, year: sel.year, semester: sel.semester })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                sessionStorage.setItem('dent2025_admin_pass', pass);
                sessionStorage.setItem('dent2025_schedule_admin_pass', pass);
                const perms = (res.data && res.data.permissions) ? res.data.permissions : {};
                sessionStorage.setItem('dent2025_permissions', JSON.stringify(perms));
                activateAdminModeMain();
            } else {
                alert(res.message || "رمز PIN غير صحيح.");
            }
        })
        .catch(err => {
            console.error('Main login error:', err);
            alert("حدث خطأ في الاتصال بالخادم أثناء تسجيل الدخول.");
        });
    }

    function activateAdminModeMain() {
        document.getElementById('dent-lock-main').style.display = 'none';
        document.getElementById('dent-logout-main').style.display = 'block';
        // Refresh dashboard to show the Edit Announcements button
        if (typeof loadDashboardData === 'function') {
            const sel = JSON.parse(localStorage.getItem('dent2025_selection') || '{}');
            if (sel.specialty) loadAnnouncements(sel);
        }
    }

    function logoutAdminMain() {
        sessionStorage.removeItem('dent2025_admin_pass');
        sessionStorage.removeItem('dent2025_schedule_admin_pass');
        sessionStorage.removeItem('dent2025_permissions');
        sessionStorage.removeItem('dent2025_passkey_info');
        document.getElementById('dent-lock-main').style.display = 'block';
        document.getElementById('dent-logout-main').style.display = 'none';
        // Refresh dashboard to hide the Edit Announcements button
        if (typeof loadDashboardData === 'function') {
            const sel = JSON.parse(localStorage.getItem('dent2025_selection') || '{}');
            if (sel.specialty) loadAnnouncements(sel);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('dent2025_admin_pass')) {
            activateAdminModeMain();
        }
    });
</script>

<!-- OIIA SPINNING CAT (STAR EASTER EGG) -->
<!-- ========================================== -->
<div id="magic-star-wrapper" style="position: relative; width: 0; height: 0; z-index: 50; overflow: visible;">
    <button id="magic-star-btn" style="opacity:0; pointer-events:none;" aria-label="Secret GIF Star">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
        </svg>
    </button>
</div>

<div id="magic-overlay"></div>

<style>
#magic-star-btn {
    position: absolute; top: -10px; left: 0; background: transparent; border: none; cursor: pointer;
    padding: 10px; outline: none; 
    -webkit-tap-highlight-color: transparent;
    opacity: 0; 
    pointer-events: none; 
}

#magic-star-btn svg {
    width: 35px; height: 35px; fill: #FFD700; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
    animation: pulseGlow 2s infinite alternate;
}

.star-entering-left { animation: flyInLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
.star-entering-right { animation: flyInRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }

.star-floating {
    opacity: 1 !important;
    pointer-events: auto !important;
    animation: wanderAndSpin 10s ease-in-out infinite alternate !important;
}

@keyframes flyInLeft {
    0% { transform: translateX(-100vw) rotate(-360deg); opacity: 0; pointer-events: none; }
    50% { opacity: 1; }
    100% { transform: translateX(0px) rotate(0deg); opacity: 1; pointer-events: auto; }
}
@keyframes flyInRight {
    0% { transform: translateX(100vw) rotate(360deg); opacity: 0; pointer-events: none; }
    50% { opacity: 1; }
    100% { transform: translateX(0px) rotate(0deg); opacity: 1; pointer-events: auto; }
}
@keyframes wanderAndSpin {
    0%   { transform: translate(0px, 0px) rotate(0deg); }
    25%  { transform: translate(40px, -30px) rotate(15deg); }
    50%  { transform: translate(60px, 20px) rotate(-10deg); }
    75%  { transform: translate(20px, 45px) rotate(20deg); }
    100% { transform: translate(-20px, -15px) rotate(-5deg); }
}
@keyframes pulseGlow {
    from { filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5)); }
    to { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 1)); }
}

#magic-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 9999999; cursor: pointer; opacity: 0;
    background-size: contain; background-repeat: no-repeat; background-position: center;
}

.fade-in { animation: simpleFadeIn 0.4s ease forwards; }
@keyframes simpleFadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.fade-out { animation: simpleFadeOut 0.3s ease forwards; }
@keyframes simpleFadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }
</style>

<script>
(function() {
    if (window.dentMagicStarInitialized) return;
    window.dentMagicStarInitialized = true;

    function initMagicStar() {
        // Clean up duplicate overlay elements if any exist from older templates
        const allOverlays = document.querySelectorAll('#magic-overlay');
        allOverlays.forEach((ov, idx) => {
            if (idx > 0) ov.remove();
        });

        const starBtn = document.getElementById('magic-star-btn');
        const overlay = document.getElementById('magic-overlay');
        const starWrapper = document.getElementById('magic-star-wrapper') || (starBtn ? starBtn.parentElement : null);
        
        if (!starBtn || !overlay) return;

        // Position star wrapper right near the dynamic announcements container at top of page
        const announcementsContainer = document.getElementById('dynamic-announcements-container');
        if (starWrapper && announcementsContainer && announcementsContainer.parentNode && starWrapper.parentNode !== announcementsContainer.parentNode) {
            announcementsContainer.parentNode.insertBefore(starWrapper, announcementsContainer.nextSibling);
        } else if (starWrapper && !announcementsContainer) {
            const content = document.querySelector('.entry-content') || document.querySelector('main');
            if (content && starWrapper.parentNode !== content) {
                content.insertBefore(starWrapper, content.firstChild);
            }
        }

        // Move overlay directly onto <body> so WordPress containers don't trap it
        if (overlay.parentNode !== document.body) {
            document.body.appendChild(overlay);
        }

        const gifUrl = "https://dent2025.com/wp-content/uploads/2026/07/gif-ezgif.com-optimize.gif";
        const audioUrl = "https://dent2025.com/wp-content/uploads/2026/05/Oiia-oiia-spinning-cat-cat-cats-catlover-catvideos-catshorts-catsofyoutube.mp3";
        
        let cachedGifBlob = null;
        let audioBlobUrl = null;

        const soundEffect = new Audio(); 
        soundEffect.loop = true;
        soundEffect.volume = 0.8; 
        soundEffect.preload = 'auto';

        function triggerStarEntry() {
            const side = Math.random() > 0.5 ? 'left' : 'right';
            const originalOverflow = document.body.style.overflowX;
            document.body.style.overflowX = 'hidden';
            starBtn.classList.add(`star-entering-${side}`);
            setTimeout(() => {
                starBtn.classList.remove(`star-entering-${side}`);
                starBtn.classList.add('star-floating');
                document.body.style.overflowX = originalOverflow;
            }, 800);
        }

        // Background media prefetch: loads GIF & MP3 without delaying star entry or initial paint
        function startStarPrefetch() {
            fetch(gifUrl)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.blob();
                })
                .then(blob => { cachedGifBlob = blob; })
                .catch(err => {
                    console.log("Star GIF prefetch fallback:", err);
                });

            fetch(audioUrl)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.blob();
                })
                .then(blob => { 
                    audioBlobUrl = URL.createObjectURL(blob);
                    soundEffect.src = audioBlobUrl;
                })
                .catch(err => {
                    soundEffect.src = audioUrl;
                });
        }

        // Star appears smoothly after 1.2s
        setTimeout(triggerStarEntry, 1200);

        // Media prefetch starts quietly in background after 600ms
        setTimeout(startStarPrefetch, 600);

        starBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            let currentUrl = gifUrl;
            if (cachedGifBlob) {
                try {
                    currentUrl = URL.createObjectURL(cachedGifBlob);
                } catch(err) {
                    currentUrl = gifUrl;
                }
            }
            overlay.dataset.currentUrl = currentUrl;
            overlay.style.backgroundImage = 'url(' + currentUrl + ')';
            overlay.style.pointerEvents = 'auto';
            
            if (!soundEffect.src) {
                soundEffect.src = audioUrl;
            }
            try { soundEffect.currentTime = 0; } catch(err) {}
            soundEffect.play().catch(err => console.log("Audio blocked:", err));

            overlay.style.display = 'block';
            overlay.classList.remove('fade-out');
            overlay.classList.add('fade-in');
        });

        function closeOverlay(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            soundEffect.pause();
            try { soundEffect.currentTime = 0; } catch(err) {}

            document.querySelectorAll('#magic-overlay').forEach(ov => {
                ov.style.pointerEvents = 'none';
                ov.classList.remove('fade-in');
                ov.classList.add('fade-out');
                setTimeout(() => {
                    ov.style.display = 'none';
                    ov.style.backgroundImage = '';
                    ov.classList.remove('fade-out');
                    ov.style.pointerEvents = 'auto';
                    const usedUrl = ov.dataset.currentUrl;
                    if (usedUrl && usedUrl.startsWith('blob:')) {
                        URL.revokeObjectURL(usedUrl);
                        ov.dataset.currentUrl = '';
                    }
                }, 200);
            });
        }

        overlay.addEventListener('click', closeOverlay);
        overlay.addEventListener('touchstart', function(e) {
            closeOverlay(e);
        }, { passive: false });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && overlay.style.display === 'block') {
                closeOverlay(e);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMagicStar);
    } else {
        initMagicStar();
    }
})();
</script>
