<canvas id="dent-kinetic-canvas" aria-hidden="true"></canvas>

<script>
(function() {
    // Avoid double initialization
    if (window.__dentKineticGridInit) return;
    window.__dentKineticGridInit = true;

    const canvas = document.getElementById('dent-kinetic-canvas');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    if (!ctx) return;

    canvas.addEventListener('contextlost', function(e) {
        e.preventDefault();
    });
    canvas.addEventListener('contextrestored', function() {
        ctx = canvas.getContext('2d');
        checkResize();
        if (!rafId && !prefersReducedMotion) {
            rafId = requestAnimationFrame(draw);
        }
    });

    // Exact site color match (#121212) + Monochrome White tokens + Golden Star Cosmic Wake
    const THEME = {
        bg: "#121212",
        lineBase: { r: 255, g: 255, b: 255, a: 0.13 },
        lineActive: { r: 255, g: 255, b: 255, a: 0.85 },
        lineStar: { r: 255, g: 215, b: 0, a: 0.78 },
        nodeBase: { r: 255, g: 255, b: 255, a: 0.22 },
        nodeActive: { r: 255, g: 255, b: 255, a: 1.0 },
        nodeStar: { r: 255, g: 228, b: 92, a: 1.0 },
        glow: "255, 255, 255",
        glowStar: "255, 215, 0",
        ripple: "255, 255, 255",
        rippleStar: "255, 215, 0"
    };

    // Responsive configuration
    const isMobile = (window.innerWidth < 768) || ('ontouchstart' in window);
    const CELL_SIZE = isMobile ? 66 : 52;
    const INFLUENCE_RADIUS = isMobile ? 220 : 280;
    const MAX_WARP = isMobile ? 20 : 28;
    const STAR_INFLUENCE_RADIUS = isMobile ? 130 : 165;
    const STAR_MAX_WARP = isMobile ? 12 : 18;
    const LERP_SPEED = 0.085;
    const NODE_BASE_RADIUS = 1.8;
    const NODE_ACTIVE_RADIUS = 3.2;

    
    let W = 0, H = 0;
    const mouse = { x: -9999, y: -9999 };
    const targetMouse = { x: -9999, y: -9999 };
    let mouseStrength = 0;
    let targetStrength = 0;
    const ripples = [];
    let rafId = 0;
    let isDirty = true; // High-efficiency render flag (0% idle CPU without ever freezing)

    // Star tracking state (Cosmic Wake)
    let starElem = null;
    const starState = {
        x: -9999,
        y: -9999,
        active: false,
        strength: 0,
        pulse: 1
    };

    window.addEventListener('dent:star-burst', function(e) {
        if (e.detail && typeof e.detail.x === 'number') {
            ripples.push({
                x: e.detail.x,
                y: e.detail.y,
                radius: 0,
                opacity: 1,
                color: THEME.rippleStar,
                born: performance.now()
            });
            isDirty = true;
        }
    }, { passive: true });

    function checkResize() {
        const newW = window.innerWidth;
        const newH = window.innerHeight;
        if (newW > 10 && newH > 10 && (canvas.width !== newW || canvas.height !== newH || W !== newW || H !== newH)) {
            W = newW;
            H = newH;
            canvas.width = W;
            canvas.height = H;
            return true;
        }
        return false;
    }

    function wakeLoop() {
        checkResize();
        draw(performance.now());
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }

    function resize() {
        checkResize();
        draw(performance.now());
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }
    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', resize, { passive: true });
    resize();

    // Interaction Listeners (Window & Document level for 100% reliable tracking)
    function handlePointerMove(clientX, clientY) {
        if (mouse.x < -1000) {
            mouse.x = clientX;
            mouse.y = clientY;
        }
        targetMouse.x = clientX;
        targetMouse.y = clientY;
        targetStrength = 1.0;
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }

    window.addEventListener('mousemove', function(e) {
        handlePointerMove(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) {
            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches[0]) {
            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    window.addEventListener('scroll', function() {
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }, { passive: true });

    // Smoothly unwind & fade out warp when cursor leaves window or tab loses focus
    function handlePointerLeave() {
        targetStrength = 0.0;
    }

    document.addEventListener('mouseleave', handlePointerLeave);
    document.documentElement.addEventListener('mouseleave', handlePointerLeave);
    window.addEventListener('blur', handlePointerLeave);
    window.addEventListener('mouseout', function(e) {
        if (!e.relatedTarget && !e.toElement) {
            handlePointerLeave();
        }
    });
    window.addEventListener('touchend', handlePointerLeave, { passive: true });
    window.addEventListener('touchcancel', handlePointerLeave, { passive: true });

    window.addEventListener('click', function(e) {
        ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 0,
            opacity: 1,
            born: performance.now()
        });
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }, { passive: true });

    // Robust Alt-Tab, Focus, PageShow and Tab Visibility Restoration
    window.addEventListener('focus', wakeLoop);
    window.addEventListener('pageshow', wakeLoop);

    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = 0;
            }
        } else {
            wakeLoop();
        }
    });

    // Pure math helpers
    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function lerpColor(c1, c2, t) {
        const r = Math.round(lerp(c1.r, c2.r, t));
        const g = Math.round(lerp(c1.g, c2.g, t));
        const b = Math.round(lerp(c1.b, c2.b, t));
        const a = lerp(c1.a, c2.a, t);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
    }

    function getWarpedPoint(gx, gy, now) {
        if (mouseStrength <= 0.0001 && ripples.length === 0 && (!starState.active || starState.strength <= 0.0001)) {
            return { x: gx, y: gy, proximity: 0, starProximity: 0 };
        }

        let rx = 0, ry = 0;
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            const rdx = gx - r.x;
            const rdy = gy - r.y;
            const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
            const waveWidth = 65;
            const diff = rdist - r.radius;
            if (Math.abs(diff) < waveWidth) {
                const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 22;
                const angle = Math.atan2(rdy, rdx);
                const sign = diff < 0 ? -1 : 1;
                rx += Math.cos(angle) * strength * sign * -1;
                ry += Math.sin(angle) * strength * sign * -1;
            }
        }

        let mouseWarpX = 0, mouseWarpY = 0, proximity = 0;
        if (mouseStrength > 0.0001) {
            const dx = gx - mouse.x;
            const dy = gy - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < INFLUENCE_RADIUS && dist > 0) {
                proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * mouseStrength;
                const t = dist / INFLUENCE_RADIUS;
                const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
                const warpAmt = eased * MAX_WARP * mouseStrength;
                const angle = Math.atan2(dy, dx);
                mouseWarpX = -Math.cos(angle) * warpAmt;
                mouseWarpY = -Math.sin(angle) * warpAmt;
            }
        }

        // Star Gravitational Pull (Cosmic Wake)
        let starWarpX = 0, starWarpY = 0, starProximity = 0;
        if (starState.active && starState.strength > 0.001) {
            const sdx = gx - starState.x;
            const sdy = gy - starState.y;
            const sdist = Math.sqrt(sdx * sdx + sdy * sdy);
            if (sdist < STAR_INFLUENCE_RADIUS && sdist > 0) {
                starProximity = Math.max(0, 1 - sdist / STAR_INFLUENCE_RADIUS) * starState.strength;
                const st = sdist / STAR_INFLUENCE_RADIUS;
                const sEased = (1 - st) * Math.sin(st * Math.PI);
                const sWarpAmt = sEased * STAR_MAX_WARP * starState.strength * starState.pulse;
                const sAngle = Math.atan2(sdy, sdx);
                starWarpX = -Math.cos(sAngle) * sWarpAmt;
                starWarpY = -Math.sin(sAngle) * sWarpAmt;
            }
        }

        return {
            x: gx + mouseWarpX + starWarpX + rx,
            y: gy + mouseWarpY + starWarpY + ry,
            proximity: proximity,
            starProximity: starProximity
        };
    }

    let isDrawing = false;

    // Main 60 FPS Continuous Render Loop
    function draw(now) {
        if (!ctx || (ctx.isContextLost && ctx.isContextLost())) {
            ctx = canvas.getContext('2d');
            if (!ctx) {
                rafId = requestAnimationFrame(draw);
                return;
            }
        }
        checkResize();

        // Track live star position (Cosmic Wake)
        if (!starElem || !starElem.isConnected) {
            starElem = document.getElementById('magic-star-btn');
        }
        if (starElem) {
            const isFloating = starElem.classList.contains('star-floating');
            const isEntering = starElem.classList.contains('star-entering-left') || starElem.classList.contains('star-entering-right');
            const isStarActive = isFloating || isEntering;
            const rect = starElem.getBoundingClientRect();
            if (isStarActive && rect.width > 0 && rect.bottom > 0 && rect.top < H && rect.right > 0 && rect.left < W) {
                starState.x = rect.left + rect.width / 2;
                starState.y = rect.top + rect.height / 2;
                starState.active = true;
                starState.strength = isEntering ? 1.0 : lerp(starState.strength, 1.0, 0.08);
                starState.pulse = 1.0 + 0.18 * Math.sin(now * 0.0035);
                isDirty = true;
            } else {
                starState.active = false;
                starState.strength = lerp(starState.strength, 0, 0.1);
                if (starState.strength > 0.001) isDirty = true;
            }
        }

        // Smoothly lerp mouse strength (fade in/out over ~350ms)
        const FADE_SPEED = 0.065;
        mouseStrength = lerp(mouseStrength, targetStrength, FADE_SPEED);
        if (mouseStrength < 0.0005) mouseStrength = 0;

        // Lerp mouse coordinates toward target
        mouse.x = lerp(mouse.x, targetMouse.x, LERP_SPEED);
        mouse.y = lerp(mouse.y, targetMouse.y, LERP_SPEED);

        const dmx = Math.abs(targetMouse.x - mouse.x);
        const dmy = Math.abs(targetMouse.y - mouse.y);
        const isConverging = (dmx > 0.1 || dmy > 0.1) && mouseStrength > 0;
        const isFading = Math.abs(targetStrength - mouseStrength) > 0.0005;
        const hasRipples = ripples.length > 0;
        const isStarMoving = starState.active && starState.strength > 0.01;

        if (isConverging || isFading || hasRipples || isStarMoving) {
            isDirty = true;
        }

        // Continuously draw while visible so buffer is never lost after fullscreen/glitches

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = THEME.bg;
        ctx.fillRect(0, 0, W, H);

        // Advance active click ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            const age = (now - r.born) / 1000;
            r.radius = Math.max(0, age * 450);
            r.opacity = Math.max(0, 1 - age * 1.35);
            if (r.opacity <= 0) ripples.splice(i, 1);
        }

        // Calculate responsive grid
        const cols = Math.max(2, Math.ceil(W / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(H / CELL_SIZE)) + 1;
        const cellW = W / (cols - 1);
        const cellH = H / (rows - 1);

        const grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                grid[r][c] = getWarpedPoint(c * cellW, r * cellH, now);
            }
        }

        // Draw line segments
        const drawSegment = function(p1, p2) {
            const avgMouse = (p1.proximity + p2.proximity) * 0.5;
            const avgStar = (p1.starProximity + p2.starProximity) * 0.5;
            const tm = avgMouse * avgMouse * (3 - 2 * avgMouse);
            const ts = avgStar * avgStar * (3 - 2 * avgStar);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);

            if (ts > tm && ts > 0.02) {
                // Golden star line glow
                ctx.strokeStyle = lerpColor(THEME.lineBase, THEME.lineStar, ts);
                ctx.lineWidth = lerp(1.1, 2.0, ts);
            } else {
                ctx.strokeStyle = lerpColor(THEME.lineBase, THEME.lineActive, tm);
                ctx.lineWidth = lerp(1.1, 1.7, tm);
            }
            ctx.stroke();
        };

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols - 1; c++) {
                drawSegment(grid[r][c], grid[r][c + 1]);
            }
        }

        for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows - 1; r++) {
                drawSegment(grid[r][c], grid[r + 1][c]);
            }
        }

        // Draw intersection nodes
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const pt = grid[r][c];
                const pr = pt.proximity;
                const sp = pt.starProximity;
                const tm = pr * pr * (3 - 2 * pr);
                const ts = sp * sp * (3 - 2 * sp);
                const tMax = Math.max(tm, ts);
                const radius = lerp(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, tMax);

                if (ts > tm && ts > 0.12) {
                    // Golden star aura on node
                    const glowRadius = radius + lerp(0, 10, ts);
                    const grad = ctx.createRadialGradient(pt.x, pt.y, radius * 0.4, pt.x, pt.y, glowRadius);
                    grad.addColorStop(0, 'rgba(' + THEME.glowStar + ', ' + (ts * 0.75).toFixed(3) + ')');
                    grad.addColorStop(1, 'rgba(' + THEME.glowStar + ', 0)');
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius * 1.15, 0, Math.PI * 2);
                    ctx.fillStyle = lerpColor(THEME.nodeBase, THEME.nodeStar, ts);
                    ctx.fill();
                } else {
                    // Standard cursor halo glow
                    if (tm > 0.25) {
                        const glowRadius = radius + lerp(0, 7, (tm - 0.25) / 0.75);
                        const grad = ctx.createRadialGradient(pt.x, pt.y, radius * 0.5, pt.x, pt.y, glowRadius);
                        grad.addColorStop(0, 'rgba(' + THEME.glow + ', ' + (tm * 0.45).toFixed(3) + ')');
                        grad.addColorStop(1, 'rgba(' + THEME.glow + ', 0)');
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = lerpColor(THEME.nodeBase, THEME.nodeActive, tm);
                    ctx.fill();
                }
            }
        }

        // Draw ripple shockwave rings
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            if (r.radius > 0) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                const colorStr = r.color || THEME.ripple;
                ctx.strokeStyle = 'rgba(' + colorStr + ', ' + (r.opacity * 0.45).toFixed(3) + ')';
                ctx.lineWidth = r.color ? 2.2 : 1.6;
                ctx.stroke();
            }
        }

                if (!document.hidden) {
            rafId = requestAnimationFrame(draw);
        } else {
            rafId = 0;
        }
    }

    // Failsafe heartbeat every 1.5s: if browser dropped GPU buffer or window restored silently
    setInterval(function() {
        if (!document.hidden) {
            checkResize();
            if (!rafId) {
                rafId = requestAnimationFrame(draw);
            }
        }
    }, 1500);

    rafId = requestAnimationFrame(draw);
})();
</script>
