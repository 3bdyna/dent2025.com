<!-- Dent2025 Interactive Monochrome White Kinetic Grid Background -->
<style id="dent-kinetic-grid-style">
    #dent-kinetic-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: -1 !important;
        pointer-events: none !important;
        background-color: #121212 !important;
    }
    /* Minimal container transparency so canvas shines through without touching any site layout/components */
    html, body, #page, .site-content, .ast-plain-container, .site, #primary {
        background-color: transparent !important;
        background-image: none !important;
    }
    body {
        background-color: #121212 !important;
    }

    /* ── 1. Reset all outer/parent wrappers so no ghost boxes or nested blur rectangles appear ── */
    #resources,
    .wp-block-group#resources,
    .wp-block-columns,
    .wp-block-column,
    #resources .wp-block-column > .wp-block-group .wp-block-group {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }

    /* ── 2. Precise, Diffused Glassmorphism & Soft Ambient Shadow across ALL Pages ── */
    #resources .wp-block-column > .wp-block-group,
    .dent-schedule-container,
    .dent-classes-widget,
    .dent-spotlight-bar,
    .dent-tomorrow-calendar-alert,
    .dent-announcements-simple,
    .gpa-banner,
    .dent-absence-banner,
    .dent-timer-banner-override,
    .dent-feedback-container,
    details.wp-block-details,
    .dent-chapter-details,
    .dent-quiz-card {
        background-color: rgba(30, 30, 30, 0.72) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
        border: 1px solid rgba(255, 255, 255, 0.07) !important;
        border-radius: 16px !important;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.38) !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, border-color 0.25s ease !important;
    }

    /* Sub-cards inside Schedule Container */
    .dent-schedule-container .stat-card {
        background: rgba(255, 255, 255, 0.035) !important;
        border: 1px solid rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(4px) !important;
        -webkit-backdrop-filter: blur(4px) !important;
        border-radius: 12px !important;
    }

    /* ── 3. Subtle Diffused Hover States ── */
    #resources .wp-block-column > .wp-block-group:hover,
    .dent-tomorrow-calendar-alert:hover,
    .dent-announcements-simple:hover,
    .gpa-banner:hover,
    .dent-absence-banner:hover,
    .dent-timer-banner-override:hover,
    .dent-chapter-details:hover,
    .dent-quiz-card:hover {
        background-color: rgba(38, 38, 38, 0.85) !important;
        border-color: rgba(255, 255, 255, 0.14) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55) !important;
    }

    /* Solid White Section Titles matching 'الجدول الدراسي' exactly */
    .dent-section-title,
    .dent-quiz-header,
    .dent-bank-header {
        color: var(--dent-text-primary, #f8fafc) !important;
        background: none !important;
        -webkit-background-clip: initial !important;
        -webkit-text-fill-color: var(--dent-text-primary, #f8fafc) !important;
    }
</style>

<canvas id="dent-kinetic-canvas" aria-hidden="true"></canvas>

<script>
(function() {
    // Avoid double initialization
    if (window.__dentKineticGridInit) return;
    window.__dentKineticGridInit = true;

    const canvas = document.getElementById('dent-kinetic-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    // Exact site color match (#121212) + Monochrome White tokens
    const THEME = {
        bg: "#121212",
        lineBase: { r: 255, g: 255, b: 255, a: 0.05 },
        lineActive: { r: 255, g: 255, b: 255, a: 0.85 },
        nodeBase: { r: 255, g: 255, b: 255, a: 0.14 },
        nodeActive: { r: 255, g: 255, b: 255, a: 1.0 },
        glow: "255, 255, 255",
        ripple: "255, 255, 255"
    };

    // Responsive configuration
    const isMobile = (window.innerWidth < 768) || ('ontouchstart' in window);
    const CELL_SIZE = isMobile ? 66 : 52;
    const INFLUENCE_RADIUS = isMobile ? 220 : 280;
    const MAX_WARP = isMobile ? 20 : 28;
    const LERP_SPEED = 0.085;
    const NODE_BASE_RADIUS = 1.6;
    const NODE_ACTIVE_RADIUS = 3.2;

    const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W = 0, H = 0;
    const mouse = { x: -9999, y: -9999 };
    const targetMouse = { x: -9999, y: -9999 };
    let mouseStrength = 0;
    let targetStrength = 0;
    const ripples = [];
    let rafId = 0;
    let isDirty = true; // High-efficiency render flag (0% idle CPU without ever freezing)

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        isDirty = true;
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    // Interaction Listeners (Window & Document level for 100% reliable tracking)
    function handlePointerMove(clientX, clientY) {
        if (mouse.x < -1000) {
            mouse.x = clientX;
            mouse.y = clientY;
        }
        targetMouse.x = clientX;
        targetMouse.y = clientY;
        targetStrength = 1.0;
        isDirty = true;
    }

    window.addEventListener('mousemove', function(e) {
        handlePointerMove(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) {
            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    // Smoothly unwind & fade out warp when cursor leaves window or tab loses focus
    function handlePointerLeave() {
        targetStrength = 0.0;
        isDirty = true;
    }

    document.addEventListener('mouseleave', handlePointerLeave);
    document.documentElement.addEventListener('mouseleave', handlePointerLeave);
    window.addEventListener('blur', handlePointerLeave);
    window.addEventListener('mouseout', function(e) {
        if (!e.relatedTarget && !e.toElement) {
            handlePointerLeave();
        }
    });
    window.addEventListener('touchend', handlePointerLeave, { passive: true });
    window.addEventListener('touchcancel', handlePointerLeave, { passive: true });

    window.addEventListener('click', function(e) {
        ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 0,
            opacity: 1,
            born: performance.now()
        });
        isDirty = true;
    }, { passive: true });

    // Page Visibility Freeze (Stops RAF when hidden, resumes instantly when visible)
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = 0;
            }
        } else {
            isDirty = true;
            if (!rafId && !prefersReducedMotion) {
                rafId = requestAnimationFrame(draw);
            }
        }
    });

    // Pure math helpers
    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function lerpColor(c1, c2, t) {
        const r = Math.round(lerp(c1.r, c2.r, t));
        const g = Math.round(lerp(c1.g, c2.g, t));
        const b = Math.round(lerp(c1.b, c2.b, t));
        const a = lerp(c1.a, c2.a, t);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
    }

    function getWarpedPoint(gx, gy) {
        if (mouseStrength <= 0.0001 && ripples.length === 0) {
            return { x: gx, y: gy, proximity: 0 };
        }

        let rx = 0, ry = 0;
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            const rdx = gx - r.x;
            const rdy = gy - r.y;
            const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
            const waveWidth = 65;
            const diff = rdist - r.radius;
            if (Math.abs(diff) < waveWidth) {
                const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * 22;
                const angle = Math.atan2(rdy, rdx);
                const sign = diff < 0 ? -1 : 1;
                rx += Math.cos(angle) * strength * sign * -1;
                ry += Math.sin(angle) * strength * sign * -1;
            }
        }

        if (mouseStrength > 0.0001) {
            const dx = gx - mouse.x;
            const dy = gy - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < INFLUENCE_RADIUS && dist > 0) {
                const proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * mouseStrength;
                const t = dist / INFLUENCE_RADIUS;
                const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
                const warpAmt = eased * MAX_WARP * mouseStrength;
                const angle = Math.atan2(dy, dx);
                return {
                    x: gx - Math.cos(angle) * warpAmt + rx,
                    y: gy - Math.sin(angle) * warpAmt + ry,
                    proximity: proximity
                };
            }
        }

        return {
            x: gx + rx,
            y: gy + ry,
            proximity: 0
        };
    }

    // Main 60 FPS Render Loop with Zero-Lag Dirty Checking & Smooth Unwind Fade
    function draw(now) {
        // Smoothly lerp mouse strength (fade in/out over ~350ms)
        const FADE_SPEED = 0.065;
        mouseStrength = lerp(mouseStrength, targetStrength, FADE_SPEED);
        if (mouseStrength < 0.0005) mouseStrength = 0;

        // Lerp mouse coordinates toward target
        mouse.x = lerp(mouse.x, targetMouse.x, LERP_SPEED);
        mouse.y = lerp(mouse.y, targetMouse.y, LERP_SPEED);

        const dmx = Math.abs(targetMouse.x - mouse.x);
        const dmy = Math.abs(targetMouse.y - mouse.y);
        const isConverging = (dmx > 0.1 || dmy > 0.1) && mouseStrength > 0;
        const isFading = Math.abs(targetStrength - mouseStrength) > 0.0005;
        const hasRipples = ripples.length > 0;

        if (isConverging || isFading || hasRipples) {
            isDirty = true;
        }

        if (!isDirty) {
            // Screen is completely still — idle loop checks next frame without drawing (0% CPU)
            rafId = requestAnimationFrame(draw);
            return;
        }

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = THEME.bg;
        ctx.fillRect(0, 0, W, H);

        // Advance active click ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            const age = (now - r.born) / 1000;
            r.radius = Math.max(0, age * 450);
            r.opacity = Math.max(0, 1 - age * 1.35);
            if (r.opacity <= 0) ripples.splice(i, 1);
        }

        // Calculate responsive grid
        const cols = Math.max(2, Math.ceil(W / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(H / CELL_SIZE)) + 1;
        const cellW = W / (cols - 1);
        const cellH = H / (rows - 1);

        const grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                grid[r][c] = getWarpedPoint(c * cellW, r * cellH);
            }
        }

        // Draw line segments
        const drawSegment = function(p1, p2) {
            const avg = (p1.proximity + p2.proximity) * 0.5;
            const t = avg * avg * (3 - 2 * avg);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = lerpColor(THEME.lineBase, THEME.lineActive, t);
            ctx.lineWidth = lerp(0.85, 1.6, t);
            ctx.stroke();
        };

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols - 1; c++) {
                drawSegment(grid[r][c], grid[r][c + 1]);
            }
        }

        for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows - 1; r++) {
                drawSegment(grid[r][c], grid[r + 1][c]);
            }
        }

        // Draw intersection nodes
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const pt = grid[r][c];
                const pr = pt.proximity;
                const t = pr * pr * (3 - 2 * pr);
                const radius = lerp(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, t);

                // Halo glow for nodes near cursor
                if (t > 0.25) {
                    const glowRadius = radius + lerp(0, 7, (t - 0.25) / 0.75);
                    const grad = ctx.createRadialGradient(pt.x, pt.y, radius * 0.5, pt.x, pt.y, glowRadius);
                    grad.addColorStop(0, 'rgba(' + THEME.glow + ', ' + (t * 0.45).toFixed(3) + ')');
                    grad.addColorStop(1, 'rgba(' + THEME.glow + ', 0)');
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = lerpColor(THEME.nodeBase, THEME.nodeActive, t);
                ctx.fill();
            }
        }

        // Draw ripple shockwave rings
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            if (r.radius > 0) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(' + THEME.ripple + ', ' + (r.opacity * 0.35).toFixed(3) + ')';
                ctx.lineWidth = 1.6;
                ctx.stroke();
            }
        }

        // If no movement and no ripples, mark clean until next interaction
        if (!isConverging && !isFading && !hasRipples) {
            isDirty = false;
        }

        rafId = requestAnimationFrame(draw);
    }

    if (prefersReducedMotion) {
        draw(performance.now());
    } else {
        rafId = requestAnimationFrame(draw);
    }
})();
</script>
