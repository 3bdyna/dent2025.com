(function() {
    // Avoid double initialization
    if (window.__dentKineticGridInit) return;
    window.__dentKineticGridInit = true;

    const canvas = document.getElementById('dent-kinetic-canvas');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    if (!ctx) return;

    canvas.addEventListener('contextlost', function(e) {
        e.preventDefault();
    });
    canvas.addEventListener('contextrestored', function() {
        ctx = canvas.getContext('2d');

    let targetStrength = 0;

    let starElem = null;

        x: -9999,
        y: -9999,
        active: false,
        strength: 0,
        pulse: 1

        if (e.detail && typeof e.detail.x === 'number') {
            ripples.push({
                x: e.detail.x,
                y: e.detail.y,
                radius: 0,
                opacity: 1,
                color: THEME.rippleStar,
                born: performance.now()
            });
            isDirty = true;

    }, { passive: true });

    function checkResize() {
        const newW = window.innerWidth;
        const newH = window.innerHeight;
        if (newW > 10 && newH > 10 && (canvas.width !== newW || canvas.height !== newH || W !== newW || H !== newH)) {
            W = newW;
            H = newH;
            canvas.width = W;
            canvas.height = H;
            return true;
        }
        return false;
    }

    function wakeLoop() {
        checkResize();
        draw(performance.now());
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }
    }

        checkResize();
        draw(performance.now());
        if (!rafId && !document.hidden) {
            rafId = requestAnimationFrame(draw);
        }

        const now = performance.now();
        if (now - lastObstacleUpdate < 90 && cachedObstacles.length > 0) return;
        lastObstacleUpdate = now;

        const list = [];
        const seen = new Set();
        for (let s = 0; s < OBSTACLE_SELECTORS.length; s++) {
            const elems = document.querySelectorAll(OBSTACLE_SELECTORS[s]);
            for (let i = 0; i < elems.length; i++) {
                const el = elems[i];
                if (seen.has(el)) continue;
                seen.add(el);
                const rect = el.getBoundingClientRect();

                        top: rect.top,

        const g = Math.round(lerp(c1.g, c2.g, t));
        const b = Math.round(lerp(c1.b, c2.b, t));

    function getWarpedPoint(gx, gy, now) {
        if (mouseStrength <= 0.0001 && ripples.length === 0 && (!starState.active || starState.strength <= 0.0001)) {
            return { x: gx, y: gy, proximity: 0, starProximity: 0 };

        // Check if node is inside any card obstacle (Option A boundary solid damping)
        let damping = 1.0;
        for (let o = 0; o < cachedObstacles.length; o++) {
            const obs = cachedObstacles[o];
            if (gx >= obs.left && gx <= obs.right && gy >= obs.top && gy <= obs.bottom) {
                damping = 0.18;
                break;
            }
        }

        let rx = 0, ry = 0;
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            const rdx = gx - r.x;
            const rdy = gy - r.y;
            const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
            const waveWidth = r.isEcho ? 50 : 65;
            const diff = rdist - r.radius;
            if (Math.abs(diff) < waveWidth) {
                const maxStrength = r.isEcho ? 12 : 22;
                const strength = (1 - Math.abs(diff) / waveWidth) * r.opacity * maxStrength * damping;
                const angle = Math.atan2(rdy, rdx);
                const sign = diff < 0 ? -1 : 1;
                rx += Math.cos(angle) * strength * sign * -1;
                ry += Math.sin(angle) * strength * sign * -1;
            }
        }

        let mouseWarpX = 0, mouseWarpY = 0, proximity = 0;
        if (mouseStrength > 0.0001) {
            const dx = gx - mouse.x;
            const dy = gy - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < INFLUENCE_RADIUS && dist > 0) {
                proximity = Math.max(0, 1 - dist / INFLUENCE_RADIUS) * mouseStrength;
                const t = dist / INFLUENCE_RADIUS;
                const eased = t < 0.01 ? 0 : (1 - t) * (1 - t) * Math.min(1, dist / 60);
                const warpAmt = eased * MAX_WARP * mouseStrength * damping;
                const angle = Math.atan2(dy, dx);
                mouseWarpX = -Math.cos(angle) * warpAmt;
                mouseWarpY = -Math.sin(angle) * warpAmt;
            }
        }

        // Star Gravitational Pull (Cosmic Wake)
        let starWarpX = 0, starWarpY = 0, starProximity = 0;
        if (starState.active && starState.strength > 0.001) {
            const sdx = gx - starState.x;
            const sdy = gy - starState.y;
            const sdist = Math.sqrt(sdx * sdx + sdy * sdy);
            if (sdist < STAR_INFLUENCE_RADIUS && sdist > 0) {
                starProximity = Math.max(0, 1 - sdist / STAR_INFLUENCE_RADIUS) * starState.strength;
                const st = sdist / STAR_INFLUENCE_RADIUS;

                const sWarpAmt = sEased * STAR_MAX_WARP * starState.strength * starState.pulse;
                const sAngle = Math.atan2(sdy, sdx);
                starWarpX = -Math.cos(sAngle) * sWarpAmt;
                starWarpY = -Math.sin(sAngle) * sWarpAmt;
            }
        }

        return {
            x: gx + mouseWarpX + starWarpX + rx,
            y: gy + mouseWarpY + starWarpY + ry,
            proximity: proximity,
            starProximity: starProximity
        };
    }

            const isFloating = starElem.classList.contains('star-floating');
            const isEntering = starElem.classList.contains('star-entering-left') || starElem.classList.contains('star-entering-right');
            const isStarActive = isFloating || isEntering;
            const rect = starElem.getBoundingClientRect();
            if (isStarActive && rect.width > 0 && rect.bottom > 0 && rect.top < H && rect.right > 0 && rect.left < W) {
                starState.x = rect.left + rect.width / 2;

                starState.active = false;
                starState.strength = lerp(starState.strength, 0, 0.1);

        const isStarMoving = starState.active && starState.strength > 0.01;

        if (isConverging || isFading || hasRipples || isStarMoving) {

            const age = (now - r.born) / 1000;
            const speed = r.isEcho ? (r.speed || 380) : 450;
            const decay = r.isEcho ? (r.decay || 1.6) : 1.35;
            r.radius = Math.max(0, age * speed);
            r.opacity = Math.max(0, 1 - age * decay);

            if (r.maxRadius && r.radius >= r.maxRadius) {
                r.opacity = 0;
            }

            if (r.opacity <= 0) {
                ripples.splice(i, 1);
                continue;
            }

            // Only primary ripples spawn boundary echoes
            if (!r.isEcho && r.opacity > 0.15) {
                if (!r.bouncedEdges) {
                    r.bouncedEdges = { left: false, right: false, top: false, bottom: false };
                }
                if (!r.bouncedObstacles) {
                    r.bouncedObstacles = {};
                }

                // 1. Viewport Screen Boundaries
                if (!r.bouncedEdges.left && (r.x - r.radius <= 0)) {
                    r.bouncedEdges.left = true;
                    spawnEcho(0, Math.max(0, Math.min(H, r.y)), r.opacity, now, 'wall');
                }
                if (!r.bouncedEdges.right && (r.x + r.radius >= W)) {
                    r.bouncedEdges.right = true;
                    spawnEcho(W, Math.max(0, Math.min(H, r.y)), r.opacity, now, 'wall');
                }
                if (!r.bouncedEdges.top && (r.y - r.radius <= 0)) {
                    r.bouncedEdges.top = true;
                    spawnEcho(Math.max(0, Math.min(W, r.x)), 0, r.opacity, now, 'wall');
                }
                if (!r.bouncedEdges.bottom && (r.y + r.radius >= H)) {
                    r.bouncedEdges.bottom = true;
                    spawnEcho(Math.max(0, Math.min(W, r.x)), H, r.opacity, now, 'wall');
                }

                // 2. Card Obstacle Boundaries
                for (let o = 0; o < cachedObstacles.length; o++) {
                    const obs = cachedObstacles[o];
                    if (r.bouncedObstacles[obs.id]) continue;

                    const cx = Math.max(obs.left, Math.min(r.x, obs.right));
                    const cy = Math.max(obs.top, Math.min(r.y, obs.bottom));
                    const dx = r.x - cx;
                    const dy = r.y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (r.radius >= dist) {
                        r.bouncedObstacles[obs.id] = true;
                        spawnEcho(cx, cy, r.opacity, now, 'card');
                        triggerCardWaveStruck(obs.el);
                    }
                }
            }
        }

        // Calculate responsive grid
        const cols = Math.max(2, Math.ceil(W / CELL_SIZE)) + 1;
        const rows = Math.max(2, Math.ceil(H / CELL_SIZE)) + 1;
        const cellW = W / (cols - 1);
        const cellH = H / (rows - 1);

        const grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                grid[r][c] = getWarpedPoint(c * cellW, r * cellH, now);
            }
        }

        // Draw line segments
        const drawSegment = function(p1, p2) {
            const avgMouse = (p1.proximity + p2.proximity) * 0.5;
            const avgStar = (p1.starProximity + p2.starProximity) * 0.5;
            const tm = avgMouse * avgMouse * (3 - 2 * avgMouse);
            const ts = avgStar * avgStar * (3 - 2 * avgStar);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);

            if (ts > tm && ts > 0.02) {
                // Golden star line glow
                ctx.strokeStyle = lerpColor(THEME.lineBase, THEME.lineStar, ts);
                ctx.lineWidth = lerp(1.1, 2.0, ts);
            } else {
                ctx.strokeStyle = lerpColor(THEME.lineBase, THEME.lineActive, tm);
                ctx.lineWidth = lerp(1.1, 1.7, tm);
            }
            ctx.stroke();
        };

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols - 1; c++) {
                drawSegment(grid[r][c], grid[r][c + 1]);
            }
        }

        for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows - 1; r++) {
                drawSegment(grid[r][c], grid[r + 1][c]);
            }
        }

        // Draw intersection nodes
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const pt = grid[r][c];
                const pr = pt.proximity;
                const sp = pt.starProximity;
                const tm = pr * pr * (3 - 2 * pr);
                const ts = sp * sp * (3 - 2 * sp);
                const tMax = Math.max(tm, ts);
                const radius = lerp(NODE_BASE_RADIUS, NODE_ACTIVE_RADIUS, tMax);

                if (ts > tm && ts > 0.12) {
                    // Golden star aura on node
                    const glowRadius = radius + lerp(0, 10, ts);
                    const grad = ctx.createRadialGradient(pt.x, pt.y, radius * 0.4, pt.x, pt.y, glowRadius);
                    grad.addColorStop(0, 'rgba(' + THEME.glowStar + ', ' + (ts * 0.75).toFixed(3) + ')');
                    grad.addColorStop(1, 'rgba(' + THEME.glowStar + ', 0)');
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius * 1.15, 0, Math.PI * 2);
                    ctx.fillStyle = lerpColor(THEME.nodeBase, THEME.nodeStar, ts);
                    ctx.fill();
                } else {
                    // Standard cursor halo glow
                    if (tm > 0.25) {
                        const glowRadius = radius + lerp(0, 7, (tm - 0.25) / 0.75);
                        const grad = ctx.createRadialGradient(pt.x, pt.y, radius * 0.5, pt.x, pt.y, glowRadius);
                        grad.addColorStop(0, 'rgba(' + THEME.glow + ', ' + (tm * 0.45).toFixed(3) + ')');
                        grad.addColorStop(1, 'rgba(' + THEME.glow + ', 0)');
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = lerpColor(THEME.nodeBase, THEME.nodeActive, tm);
                    ctx.fill();
                }
            }
        }

        // Draw ripple shockwave rings
        for (let i = 0; i < ripples.length; i++) {
            const r = ripples[i];
            if (r.radius > 0) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                const colorStr = r.color || THEME.ripple;
                const alpha = (r.opacity * (r.isEcho ? 0.28 : 0.45)).toFixed(3);
                ctx.strokeStyle = 'rgba(' + colorStr + ', ' + alpha + ')';
                ctx.lineWidth = r.isEcho ? 1.2 : (r.color ? 2.2 : 1.6);
                ctx.stroke();
            }
        }

                if (!document.hidden) {
            rafId = requestAnimationFrame(draw);
        } else {
            rafId = 0;
        }
    }

    // Failsafe heartbeat every 1.5s: if browser dropped GPU buffer or window restored silently
    setInterval(function() {
        if (!document.hidden) {
            checkResize();
            if (!rafId) {
                rafId = requestAnimationFrame(draw);
            }
        }
    }, 1500);

    rafId = requestAnimationFrame(draw);
})();
</script>
